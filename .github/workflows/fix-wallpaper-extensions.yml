name: Fix LucidOS wallpaper asset extensions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-wallpaper-extensions.yml

permissions:
  contents: write

jobs:
  rename-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ github.token }}
      - name: Rename JPEG payloads and clean up importer
        run: |
          set -euo pipefail
          file theme/assets/lucid-wallpaper-*.png
          git mv theme/assets/lucid-wallpaper-dusk.png theme/assets/lucid-wallpaper-dusk.jpg
          git mv theme/assets/lucid-wallpaper-alpine.png theme/assets/lucid-wallpaper-alpine.jpg
          git rm .github/workflows/fix-wallpaper-extensions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use correct JPEG extensions for LucidOS wallpapers'
          git push origin HEAD:main
