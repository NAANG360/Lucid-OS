name: Build Lucid Control Centre APK
on:
  push:
    branches:
      - feature/lucid-control-centre-connect
    paths:
      - 'theme/lucid-control-centre/**'
      - '.github/workflows/build-lucid-control-centre.yml'
  pull_request:
    paths:
      - 'theme/lucid-control-centre/**'
      - '.github/workflows/build-lucid-control-centre.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package, and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/theme/lucid-control-centre"
          OUT="$RUNNER_TEMP/lucid-control-centre"
          mkdir -p "$OUT/classes" "$OUT/dex" "$OUT/pkg"
          javac -source 8 -target 8 -bootclasspath "$ANDROID_HOME/platforms/android-35/android.jar" -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d "$OUT/classes" "$APP/src/com/lucid/os/controlcentre/MainActivity.java"
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$OUT/dex" $(find "$OUT/classes" -name '*.class')
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f -M "$APP/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-35/android.jar" -F "$OUT/Lucid-Control-Centre-unsigned.apk"
          cp "$OUT/dex/classes.dex" "$OUT/classes.dex"
          (cd "$OUT" && zip -q "$OUT/Lucid-Control-Centre-unsigned.apk" classes.dex)
          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Lucid OS Debug,O=Lucid,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/Lucid-Control-Centre.apk" "$OUT/Lucid-Control-Centre-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT/Lucid-Control-Centre.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/Lucid-Control-Centre.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-control-centre-apk
          path: ${{ runner.temp }}/lucid-control-centre/Lucid-Control-Centre.apk
          if-no-files-found: error
          retention-days: 14