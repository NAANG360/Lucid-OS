name: Lucid Dynapunch CI
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - '.gitmodules'
      - 'theme/dynapunch/**'
      - 'tools/brand_dynapunch.py'
      - '.github/workflows/lucid-dynapunch.yml'
permissions:
  contents: read
jobs:
  build-test-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,build-tools;36.0.0,platforms;android-36'
      - name: Apply Lucid Dynapunch branding
        run: python3 tools/brand_dynapunch.py theme/dynapunch/upstream
      - name: Run upstream unit tests and build Dynapunch
        working-directory: theme/dynapunch/upstream
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$GITHUB_WORKSPACE/out/dynapunch"
          cp "$APK" "$GITHUB_WORKSPACE/out/dynapunch/Lucid-Dynapunch-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/out/dynapunch/Lucid-Dynapunch-debug.apk" > "$GITHUB_WORKSPACE/out/dynapunch/SHA256SUMS.txt"
      - name: Boot Android 15 emulator and capture setup UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 4096 -cores 4
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            mkdir -p out/dynapunch/emulator
            adb install -r out/dynapunch/Lucid-Dynapunch-debug.apk
            PKG=com.agupta07505.smartisland
            ACTIVITY="$(adb shell cmd package resolve-activity --brief "$PKG" | tr -d '\r' | tail -n 1)"
            test -n "$ACTIVITY"
            adb shell am start -W -n "$ACTIVITY" | tee out/dynapunch/emulator/launch.txt
            sleep 8
            adb shell dumpsys activity activities > out/dynapunch/emulator/activities.txt
            grep -q "$PKG" out/dynapunch/emulator/activities.txt
            adb shell screencap -p /sdcard/lucid-dynapunch-setup.png
            adb pull /sdcard/lucid-dynapunch-setup.png out/dynapunch/emulator/Lucid-Dynapunch-Setup.png
            adb logcat -d -t 10000 > out/dynapunch/emulator/logcat.txt
            if grep -E 'FATAL EXCEPTION|ANR in ' out/dynapunch/emulator/logcat.txt; then exit 1; fi
            echo "PASS: Dynapunch installed, setup activity launched, screenshot captured, no fatal exception/ANR signature." > out/dynapunch/emulator/result.txt
      - name: Upload Dynapunch APK and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-dynapunch-build-and-emulator
          path: out/dynapunch/
          if-no-files-found: warn
          retention-days: 30
