name: Lightweight ROM tooling tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/compare_rom_installers.py'
      - 'tests/test_compare_rom_installers.py'
      - 'tools/reconstruct_transfer_image.py'
      - 'tests/test_reconstruct_transfer_image.py'
      - 'tools/validate_lucid_preservation.py'
      - 'tests/test_validate_lucid_preservation.py'
      - 'tools/stage_lucid_overlays.py'
      - 'tests/test_stage_lucid_overlays.py'
      - 'system-tree/system/bin/lucid_*.sh'
      - 'system-tree/system/etc/init/init.lucid.rc'
      - '.github/workflows/lightweight-rom-tooling-tests.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install reconstruction test dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-brotli
      - name: Test ROM comparison and partition reconstruction
        run: |
          python3 -m unittest discover -s tests -p 'test_compare_rom_installers.py' -v
          python3 tests/test_validate_lucid_preservation.py -v
          python3 tests/test_stage_lucid_overlays.py -v
          python3 tests/test_reconstruct_transfer_image.py
          sh -n system-tree/system/bin/lucid_root_toggle.sh
          sh -n system-tree/system/bin/lucid_firstboot.sh
          sh -n system-tree/system/bin/lucid_desktop.sh
