name: Build Lucid Updater APK
on:
  push:
    branches: [feature/lucid-control-centre-connect]
    paths: ['theme/lucid-updater/**', '.github/workflows/build-lucid-updater.yml']
  pull_request:
    paths: ['theme/lucid-updater/**', '.github/workflows/build-lucid-updater.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
          test -d "$ANDROID_HOME/platforms"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package, and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/theme/lucid-updater"
          OUT="$RUNNER_TEMP/lucid-updater"
          mkdir -p "$OUT/classes" "$OUT/dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d "$OUT/classes" "$APP/src/com/lucid/os/updater/MainActivity.java"
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$OUT/dex" $(find "$OUT/classes" -name '*.class')
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f -M "$APP/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-35/android.jar" -F "$OUT/Lucid-Updater-unsigned.apk"
          cp "$OUT/dex/classes.dex" "$OUT/classes.dex"
          (cd "$OUT" && zip -q "$OUT/Lucid-Updater-unsigned.apk" classes.dex)
          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Lucid OS Debug,O=Lucid,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/Lucid-Updater.apk" "$OUT/Lucid-Updater-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT/Lucid-Updater.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/Lucid-Updater.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-updater-apk
          path: ${{ runner.temp }}/lucid-updater/Lucid-Updater.apk
          if-no-files-found: error
          retention-days: 14