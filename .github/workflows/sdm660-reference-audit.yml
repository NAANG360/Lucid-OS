name: SDM660 Source Reference Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/analyze_sdm660_reference.py'
      - '.github/workflows/sdm660-reference-audit.yml'

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install git and Python
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3
      - name: Fetch public SDM660 and lavender source references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference-work
          clone_sparse() {
            local url="$1" dir="$2"
            shift 2
            if git clone --depth 1 --filter=blob:none --sparse "$url" "reference-work/$dir"; then
              git -C "reference-work/$dir" sparse-checkout set "$@" || true
            else
              echo "WARN: unable to clone $url" | tee -a "$RUNNER_TEMP/clone-warnings.txt"
            fi
          }
          clone_sparse https://github.com/SDM660-Project/device_xiaomi_lavender.git lavender-device
          clone_sparse https://github.com/SDM660-Project/device_xiaomi_sdm660-common.git sdm660-common
          clone_sparse https://github.com/sdm660-mainline/linux.git sdm660-mainline-linux \
            arch/arm64/boot/dts/qcom arch/arm64/configs \
            Documentation/devicetree/bindings/arm/qcom \
            drivers/soc/qcom drivers/clk/qcom drivers/firmware/qcom \
            drivers/remoteproc drivers/gpu/drm/msm
          clone_sparse https://github.com/Atom-X-Devs/android_kernel_qcom_sdm660.git android-kernel-sdm660 \
            arch/arm64/boot/dts arch/arm64/configs drivers/soc/qcom drivers/clk/qcom drivers/firmware/qcom
          clone_sparse https://github.com/ParsimoniousLavender/device_xiaomi_lavender.git alternate-lavender-device
          if [[ -f "$RUNNER_TEMP/clone-warnings.txt" ]]; then cat "$RUNNER_TEMP/clone-warnings.txt"; fi
      - name: Generate compatibility inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/analyze_sdm660_reference.py reference-work report/sdm660-reference
      - name: Upload source-reference report
        uses: actions/upload-artifact@v4
        with:
          name: sdm660-lavender-source-reference
          path: report/sdm660-reference/
          if-no-files-found: error
          retention-days: 30
