name: Build integrated LucidOS ROM from Build 3

on:
  workflow_dispatch:
  push:
    branches: [fix/lucid-gemini-integration, feature/lucid-all-apps-refreshed-connect]
    paths:
      - tools/build_lucid_apps.sh
      - tools/repack_transfer_image.py
      - .github/workflows/build-integrated-lucid-rom.yml
      - system/bin/**
      - theme/lucid-control-centre/**
      - theme/lucid-settings/**
      - theme/lucid-launcher/**
      - theme/lucid-updater/**
      - theme/wallpaper-app/**
      - theme/about-app/**
      - theme/rro-systemui/**
      - theme/control-center-app/**
      - theme/lucid-desktop/**
      - theme/dynamic-island/**
      - theme/assets/**

permissions:
  contents: write

concurrency:
  group: lucid-rom-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install image and archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs brotli unzip zip attr

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Build Lucid apps
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build_lucid_apps.sh "$RUNNER_TEMP/lucid-apps"
          gradle -p theme/dynamic-island assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/lucid-apps/lucid-build.keystore" \
            --ks-pass pass:lucidbuild --key-pass pass:lucidbuild \
            --out "$RUNNER_TEMP/lucid-apps/Lucid-Dynamic-Island.apk" \
            theme/dynamic-island/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$RUNNER_TEMP/lucid-apps/Lucid-Dynamic-Island.apk"
          mkdir -p "$RUNNER_TEMP/rom" "$RUNNER_TEMP/parts" "$RUNNER_TEMP/mnt/system" "$RUNNER_TEMP/report"

      - name: Download Build 3 and verify published digest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/releases/tags/lucid-android15-lavender-build-3 > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          if r.get("draft"): raise SystemExit("Build 3 release unexpectedly is a draft")
          a=next((a for a in r.get("assets",[]) if a.get("name")=="LucidOS-Android15-lavender-unsigned.zip"),None)
          if not a: raise SystemExit("Build 3 ROM asset is missing")
          if a.get("size")!=1326072199 or a.get("digest")!="sha256:c7262b06d6c2a60ceae395b21539de972c3c52085640bee87a7a55dacab7aba7":
              raise SystemExit(f"Build 3 asset identity changed: size={a.get('size')} digest={a.get('digest')}")
          json.dump(a,open(sys.argv[1]+".asset","w"))
          PY
          ASSET_ID="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/release.json.asset")"
          curl --fail --location --retry 4 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            -o "$RUNNER_TEMP/rom/build3.zip"
          echo "Expected SHA-256: c7262b06d6c2a60ceae395b21539de972c3c52085640bee87a7a55dacab7aba7" > "$RUNNER_TEMP/report/base-identity.txt"
          echo "Actual SHA-256: $(sha256sum "$RUNNER_TEMP/rom/build3.zip" | cut -d' ' -f1)" >> "$RUNNER_TEMP/report/base-identity.txt"
          echo "Actual size: $(stat -c %s "$RUNNER_TEMP/rom/build3.zip")" >> "$RUNNER_TEMP/report/base-identity.txt"
          echo "Build 3 ZIP integrity:" >> "$RUNNER_TEMP/report/base-identity.txt"
          unzip -t "$RUNNER_TEMP/rom/build3.zip" | tail -n 2 >> "$RUNNER_TEMP/report/base-identity.txt"
          test "$(sha256sum "$RUNNER_TEMP/rom/build3.zip" | cut -d' ' -f1)" = "c7262b06d6c2a60ceae395b21539de972c3c52085640bee87a7a55dacab7aba7"

      - name: Extract Build 3 system partition
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/rom/build3.zip" "$RUNNER_TEMP/parts" <<'PY'
          import os,sys,zipfile
          zpath,out=sys.argv[1:]
          os.makedirs(out,exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              names=z.namelist()
              for wanted in ("system.transfer.list","system.new.dat.br"):
                  matches=[n for n in names if n==wanted or n.endswith("/"+wanted)]
                  if not matches: raise SystemExit("Build 3 is missing "+wanted)
                  chosen=matches[0]
                  with z.open(chosen) as src,open(os.path.join(out,wanted),"wb") as dst:
                      while True:
                          block=src.read(4*1024*1024)
                          if not block: break
                          dst.write(block)
              open(os.path.join(out,"original-entry-list.txt"),"w").write("\n".join(names)+"\n")
          PY
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet brotli
          "$RUNNER_TEMP/venv/bin/python" tools/reconstruct_transfer_image.py \
            "$RUNNER_TEMP/parts/system.transfer.list" "$RUNNER_TEMP/parts/system.new.dat.br" \
            "$RUNNER_TEMP/parts/system.img" | tee "$RUNNER_TEMP/report/reconstruction.txt"
          if grep -q 'transfer list leaves declared filesystem blocks untouched' "$RUNNER_TEMP/report/reconstruction.txt"; then
            echo "Build 3 system payload is incomplete; refusing to overwrite it." >&2
            exit 1
          fi
          e2fsck -fn "$RUNNER_TEMP/parts/system.img" > "$RUNNER_TEMP/report/e2fsck-before.txt" 2>&1 || { cat "$RUNNER_TEMP/report/e2fsck-before.txt"; exit 1; }

      - name: Overlay Lucid additions on Build 3 system image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/parts/system.img"
          MNT="$RUNNER_TEMP/mnt/system"
          APPS="$RUNNER_TEMP/lucid-apps"
          sudo mount -t ext4 -o loop,rw "$IMAGE" "$MNT"
          trap 'sudo umount "$MNT" 2>/dev/null || true' EXIT

          # Remove any pre-existing APK carrying the same package name before installing
          # the refreshed build. This prevents duplicate/obsolete Lucid packages.
          remove_existing_package() {
            local package="$1"
            while IFS= read -r -d '' apk; do
              if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" 2>/dev/null | grep -q "^package: name='$package'"; then
                echo "Replacing existing package $package at $apk"
                sudo rm -rf "$(dirname "$apk")"
              fi
            done < <(find "$MNT/system/app" "$MNT/system/priv-app" -type f -name '*.apk' -print0 2>/dev/null || true)
          }
          install_app() {
            local dir="$1" apk="$2" package="$3"
            remove_existing_package "$package"
            sudo rm -rf "$MNT/system/app/$dir"
            sudo install -d -m 0755 "$MNT/system/app/$dir"
            sudo install -m 0644 "$APPS/$apk" "$MNT/system/app/$dir/$apk"
          }
          install_app LucidControlCentre Lucid-Control-Centre.apk com.lucid.os.controlcentre
          install_app LucidSettings Lucid-Settings.apk com.lucid.os.settings
          install_app LucidLauncher Lucid-Launcher.apk com.lucid.os.launcher
          install_app LucidUpdater Lucid-Updater.apk com.lucid.os.updater
          install_app LucidWallpapers Lucid-Wallpapers.apk com.lucid.os.wallpaper
          install_app LucidAbout Lucid-About.apk com.lucid.os.about
          install_app LucidDesktop Lucid-Desktop.apk com.lucid.os.desktop
          install_app LucidDynamicIsland Lucid-Dynamic-Island.apk com.lucid.os.island

          # Package the static SystemUI RRO; it is not a substitute for a
          # framework SystemUI rebuild, but this makes the authored overlay deployable.
          sudo install -d -m 0755 "$MNT/system/product/overlay"
          sudo install -m 0644 "$APPS/Lucid-SystemUI-Overlay.apk" "$MNT/system/product/overlay/Lucid-SystemUI-Overlay.apk"

          sudo install -d -m 0755 "$MNT/system/bin" "$MNT/system/usr/lucid" "$MNT/system/etc/lucid/wallpapers"
          sudo install -m 0755 system/bin/lucid_desktop.sh "$MNT/system/bin/lucid_desktop.sh"
          sudo install -m 0755 system/bin/lucid_root_toggle.sh "$MNT/system/bin/lucid_root_toggle.sh"
          sudo install -m 0644 system-tree/system/usr/lucid/ubuntu-base-arm64.tar.gz "$MNT/system/usr/lucid/ubuntu-base-arm64.tar.gz"
          for wallpaper in wallpaper-bubbles.png wallpaper-purple-crescent.png wallpaper-lucid-crescent.png wallpaper-clock-home.png wallpaper-brushwork.png wallpaper-dynapunch.png lucid-wallpaper-alpine.jpg lucid-wallpaper-dusk.jpg; do
            sudo install -m 0644 "theme/wallpaper-app/assets/$wallpaper" "$MNT/system/etc/lucid/wallpapers/$wallpaper"
          done
          sudo tee "$MNT/system/etc/lucid/integration-manifest.txt" >/dev/null <<'EOF'
          LucidOS experimental integration overlay
          Base archive: lucid-android15-lavender-build-3
          Included apps: Lucid Control Centre, Settings, Launcher, Updater, Wallpapers, About, Desktop, Dynamic Island
          Included desktop payload: lucid_desktop.sh, lucid_root_toggle.sh, ubuntu-base-arm64.tar.gz
          Included wallpapers: all eight Lucid collection assets
          Note: this is an experimental repack of Build 3; it is not certified bootable or safe for flashing.
          EOF
          sudo chmod 0644 "$MNT/system/etc/lucid/integration-manifest.txt"
          sudo sync
          sudo umount "$MNT"
          trap - EXIT

      - name: Apply Android SELinux labels to added files
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/parts/system.img"
          label() {
            local path="$1"
            sudo debugfs -w -R "ea_set $path security.selinux u:object_r:system_file:s0" "$IMAGE" >/dev/null
          }
          for path in \
            /system/app/LucidControlCentre /system/app/LucidControlCentre/Lucid-Control-Centre.apk \
            /system/app/LucidSettings /system/app/LucidSettings/Lucid-Settings.apk \
            /system/app/LucidLauncher /system/app/LucidLauncher/Lucid-Launcher.apk \
            /system/app/LucidUpdater /system/app/LucidUpdater/Lucid-Updater.apk \
            /system/app/LucidWallpapers /system/app/LucidWallpapers/Lucid-Wallpapers.apk \
            /system/app/LucidDesktop /system/app/LucidDesktop/Lucid-Desktop.apk \
            /system/app/LucidDynamicIsland /system/app/LucidDynamicIsland/Lucid-Dynamic-Island.apk \\
            /system/app/LucidAbout /system/app/LucidAbout/Lucid-About.apk \\
            /system/product/overlay /system/product/overlay/Lucid-SystemUI-Overlay.apk \
            /system/bin/lucid_desktop.sh /system/bin/lucid_root_toggle.sh \
            /system/usr/lucid /system/usr/lucid/ubuntu-base-arm64.tar.gz \
            /system/etc/lucid /system/etc/lucid/wallpapers \
            /system/etc/lucid/wallpapers/lucid-wallpaper-alpine.jpg \
            /system/etc/lucid/wallpapers/lucid-wallpaper-dusk.jpg \
            /system/etc/lucid/integration-manifest.txt; do
            label "$path"
          done
          e2fsck -fn "$IMAGE" > "$RUNNER_TEMP/report/e2fsck-after.txt" 2>&1 || { cat "$RUNNER_TEMP/report/e2fsck-after.txt"; exit 1; }
          sha256sum "$IMAGE" > "$RUNNER_TEMP/report/integrated-system-image.sha256"

      - name: Rebuild system.new.dat.br and replace only that ZIP entry
        shell: bash
        run: |
          set -euo pipefail
          PARTS="$RUNNER_TEMP/parts"
          OUT="$RUNNER_TEMP/rom/LucidOS-Android15-lavender-build-4-experimental.zip"
          "$RUNNER_TEMP/venv/bin/python" tools/repack_transfer_image.py \
            "$PARTS/system.transfer.list" "$PARTS/system.img" "$PARTS/system.new.dat"
          brotli -q 5 -f -o "$PARTS/system.new.dat.br.repacked" "$PARTS/system.new.dat"
          mv "$PARTS/system.new.dat.br.repacked" "$PARTS/system.new.dat.br"
          brotli -d -f -o "$PARTS/system.new.dat.roundtrip" "$PARTS/system.new.dat.br"
          cmp "$PARTS/system.new.dat" "$PARTS/system.new.dat.roundtrip"
          cp "$RUNNER_TEMP/rom/build3.zip" "$OUT"
          (cd "$PARTS" && zip -q -0 "$OUT" system.new.dat.br)
          unzip -t "$OUT" | tail -n 2 | tee "$RUNNER_TEMP/report/integrated-zip-check.txt"
          sha256sum "$OUT" | tee "$RUNNER_TEMP/report/integrated-rom.sha256"
          stat -c 'size_bytes=%s' "$OUT" | tee "$RUNNER_TEMP/report/integrated-rom-size.txt"
          unzip -p "$OUT" system.transfer.list | cmp - "$PARTS/system.transfer.list"
          unzip -p "$OUT" system.new.dat.br | cmp - "$PARTS/system.new.dat.br"

      - name: Publish experimental Build 4 and update OTA manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ROM="$RUNNER_TEMP/rom/LucidOS-Android15-lavender-build-4-experimental.zip"
          TAG="lucid-android15-lavender-build-4"
          cat > "$RUNNER_TEMP/report/release-notes.md" <<'EOF'
          ## Experimental integrated LucidOS Build 4 — lavender

          This package uses the published Build 3 ZIP as its system base and overlays the Lucid app APKs, desktop scripts/rootfs archive, and wallpapers from the repository.

          **Important:** This is an experimental integration package, not verified bootable or safe for flashing. Build 3's Android-version/fingerprint discrepancy remains unresolved. The included companion apps are packaged as regular system apps; the actual Android SystemUI source has not been rebuilt, and the Developer Options root toggle is not yet integrated. Back up first and do not flash on a primary device.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Build 4 release already exists; syncing OTA manifest to its actual published asset."
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release-build4.json"
            read -r SHA SIZE URL < <(python3 - "$RUNNER_TEMP/release-build4.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          a=next((x for x in r.get("assets",[]) if x.get("name")=="LucidOS-Android15-lavender-build-4-experimental.zip"),None)
          if not a: raise SystemExit("Build 4 release exists but its ROM asset is missing")
          digest=a.get("digest") or ""
          if not digest.startswith("sha256:"): raise SystemExit(f"Published asset has no SHA-256 digest: {digest!r}")
          print(digest.split(":",1)[1],a["size"],a["browser_download_url"])
          PY
            )
          else
            gh release create "$TAG" "$ROM" \
              --title "LucidOS Android 15 lavender — Build 4 experimental integration" \
              --prerelease --notes-file "$RUNNER_TEMP/report/release-notes.md"
            SHA="$(sha256sum "$ROM" | cut -d' ' -f1)"
            SIZE="$(stat -c %s "$ROM")"
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-build-4-experimental.zip"
          fi
          python3 - "$GITHUB_WORKSPACE/ota/stable.json" "$SHA" "$SIZE" "$TAG" "$URL" <<'PY'
          import json,sys
          path,sha,size,tag,url=sys.argv[1:]
          d=json.load(open(path))
          d["version"]="0.4-dev"
          d["url"]=url
          d["sha256"]=sha
          d["size"]=int(size)
          d["installable"]=False
          d["changelog"]="Experimental Build 4: Build 3 system image with Lucid companion apps, desktop payload, and wallpapers overlaid. Android-version/fingerprint discrepancy and physical-device boot remain unverified; do not flash until validated."
          with open(path,"w") as f: json.dump(d,f,indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ota/stable.json
          git commit -m "Point OTA manifest to experimental integrated Build 4" || true
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-build4-integration-reports
          path: ${{ runner.temp }}/report/
          if-no-files-found: warn
          retention-days: 30
