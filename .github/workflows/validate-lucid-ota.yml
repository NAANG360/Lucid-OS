name: Validate Lucid OTA Manifest

on:
  workflow_dispatch:
  push:
    branches: [main, feature/lucid-control-centre-connect]
    paths:
      - 'ota/**'
      - '.github/workflows/validate-lucid-ota.yml'
  pull_request:
    paths:
      - 'ota/**'
      - '.github/workflows/validate-lucid-ota.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate manifest schema and release URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse, unquote

          path = Path("ota/stable.json")
          if not path.is_file():
              raise SystemExit("Missing ota/stable.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          required = ("device", "version", "url", "sha256", "size", "changelog")
          missing = [key for key in required if key not in data]
          if missing:
              raise SystemExit("Missing manifest fields: " + ", ".join(missing))
          if data["device"] != "lavender":
              raise SystemExit("OTA target must be lavender")
          if not isinstance(data["version"], str) or not data["version"].strip():
              raise SystemExit("OTA version must be a non-empty string")
          if not isinstance(data["url"], str) or not data["url"].startswith("https://"):
              raise SystemExit("OTA URL must use HTTPS")
          if not re.fullmatch(r"[0-9a-fA-F]{64}", str(data["sha256"])):
              raise SystemExit("OTA SHA-256 must contain exactly 64 hexadecimal characters")
          if not isinstance(data["size"], int) or data["size"] <= 0:
              raise SystemExit("OTA size must be a positive integer")
          if not isinstance(data["changelog"], str):
              raise SystemExit("OTA changelog must be a string")
          if "installable" in data and not isinstance(data["installable"], bool):
              raise SystemExit("installable must be a JSON boolean")

          req = urllib.request.Request(data["url"], method="HEAD", headers={"User-Agent": "LucidOS-OTA-Validator/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"ROM URL returned HTTP {response.status}")
                  length = response.headers.get("Content-Length")
                  if length and int(length) != data["size"]:
                      raise SystemExit(f"Manifest size {data['size']} != remote Content-Length {length}")

              parts = [unquote(p) for p in urlparse(data["url"]).path.split("/") if p]
              try:
                  download_idx = parts.index("download")
                  tag, asset_name = parts[download_idx + 1], parts[download_idx + 2]
              except (ValueError, IndexError):
                  raise SystemExit("OTA URL must be a GitHub release-download URL so its published digest can be verified")
              api_url = f"https://api.github.com/repos/NAANG360/Lucid-OS/releases/tags/{tag}"
              api_req = urllib.request.Request(api_url, headers={"User-Agent": "LucidOS-OTA-Validator/1.0", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(api_req, timeout=30) as response:
                  release = json.load(response)
              asset = next((a for a in release.get("assets", []) if a.get("name") == asset_name and a.get("browser_download_url") == data["url"]), None)
              if asset is None:
                  raise SystemExit("ROM URL does not match an asset in the named public GitHub release")
              if asset.get("size") != data["size"]:
                  raise SystemExit(f"Manifest size {data['size']} != GitHub release asset size {asset.get('size')}")
              digest = asset.get("digest", "")
              expected = "sha256:" + data["sha256"].lower()
              if digest and digest.lower() != expected:
                  raise SystemExit(f"Manifest SHA-256 does not match GitHub's published asset digest ({digest})")
              if data.get("installable", True) is False:
                  print("Safety hold: archive is intentionally marked non-installable pending ROM compatibility verification.")
              print(f"Manifest valid; public release asset confirmed; size={data['size']}; GitHub digest {'matches' if digest else 'not published by API'}; installable={data.get('installable', True)}.")
          except Exception as exc:
              raise SystemExit(f"Could not validate public ROM release asset: {exc}")
          PY