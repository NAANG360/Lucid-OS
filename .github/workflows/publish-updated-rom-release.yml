name: Publish Updated LucidOS ROM and OTA Manifest

on:
  workflow_run:
    workflows: ["Assemble Integrated LucidOS ROM"]
    types: [completed]
    branches: [fix/chroot-desktop-runtime]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful integrated ROM build workflow run ID
        required: true
        type: string
      artifact_name:
        description: Actions artifact containing the validated ROM ZIP
        required: true
        default: lucid-integrated-android15-rom
        type: string
      release_tag:
        description: Existing or new release tag for this ROM
        required: true
        default: lucid-android15-lavender-build-4
        type: string
      version:
        description: Version shown in the System Updater
        required: true
        default: 0.4.0-dev
        type: string
      target_sha:
        description: Exact source commit SHA used to build the ROM
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download exact ROM build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name || 'lucid-integrated-android15-rom' }}
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Verify ROM ZIP and calculate checksum
        id: rom
        shell: bash
        run: |
          set -euo pipefail
          find incoming -maxdepth 3 -type f -printf '%p %s bytes\n'
          ROM="$(find incoming -type f -name '*.zip' -size +1000M -print -quit)"
          if [[ -z "$ROM" ]]; then
            echo "No integrated ROM ZIP larger than 1 GB found in build artifact." >&2
            exit 1
          fi
          unzip -tq "$ROM"
          SHA="$(sha256sum "$ROM" | awk '{print $1}')"
          SIZE="$(stat -c %s "$ROM")"
          {
            echo "rom_path=$ROM"
            echo "sha256=$SHA"
            echo "size=$SIZE"
          } >> "$GITHUB_OUTPUT"
          sha256sum "$ROM"
          echo "Validated ZIP size: $SIZE bytes"

      - name: Create release or safely reuse matching Build 4 asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          VERSION: ${{ inputs.version || '0.4.0-dev' }}
          TARGET_SHA: ${{ inputs.target_sha || github.event.workflow_run.head_sha }}
          ROM_PATH: ${{ steps.rom.outputs.rom_path }}
          ROM_SHA256: ${{ steps.rom.outputs.sha256 }}
          ROM_SIZE: ${{ steps.rom.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="LucidOS-Android15-lavender-unsigned.zip"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            RELEASE_TARGET="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$RELEASE_TARGET" != "$TARGET_SHA" ]]; then
              echo "Existing release target $RELEASE_TARGET does not match requested build commit $TARGET_SHA; refusing to alter it." >&2
              exit 1
            fi
            ASSET_INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "'"$ASSET_NAME"'") | [.size, (.digest // ""), .url] | @tsv')"
            if [[ -n "$ASSET_INFO" ]]; then
              IFS=$'\t' read -r EXISTING_SIZE EXISTING_DIGEST EXISTING_URL <<< "$ASSET_INFO"
              if [[ "$EXISTING_SIZE" != "$ROM_SIZE" || "$EXISTING_DIGEST" != "sha256:$ROM_SHA256" ]]; then
                echo "Existing release asset does not match the integrity-checked artifact; refusing to overwrite it." >&2
                echo "Expected size=$ROM_SIZE sha256=$ROM_SHA256; existing size=$EXISTING_SIZE digest=$EXISTING_DIGEST" >&2
                exit 1
              fi
              echo "Existing Build 4 asset matches the validated artifact; preserving it."
              echo "$EXISTING_URL"
            else
              gh release upload "$TAG" "$ROM_PATH" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "$ROM_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LucidOS Android 15 — lavender $TAG" \
              --prerelease \
              --target "$TARGET_SHA" \
              --notes "Updated LucidOS Android 15 integrated ROM for Xiaomi Redmi Note 7/7S (lavender). Version: $VERSION. Includes the latest Lucid Setup app, Lucid Wallpapers, Lucid About, generated Lucid boot animation, System Updater with root-assisted recovery staging, and preserved Lucid runtime payloads. CI validates package integrity and partition round-trips; physical-device boot is not yet confirmed. Unsigned ZIP. Review recovery and firmware compatibility before flashing. SHA-256: $ROM_SHA256"
          fi

      - name: Verify published asset digest and size before manifest update
        id: asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          ROM_SHA256: ${{ steps.rom.outputs.sha256 }}
          ROM_SIZE: ${{ steps.rom.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          ASSET_NAME="LucidOS-Android15-lavender-unsigned.zip"
          ASSET_INFO="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,isDraft --jq '.assets[] | select(.name == "'"$ASSET_NAME"'") | [.name, .size, (.digest // ""), .url] | @tsv')"
          if [[ -z "$ASSET_INFO" ]]; then
            echo "Expected ROM release asset is missing." >&2
            exit 1
          fi
          IFS=$'\t' read -r ASSET_NAME_FOUND ASSET_SIZE ASSET_DIGEST ASSET_URL <<< "$ASSET_INFO"
          if [[ "$ASSET_NAME_FOUND" != "$ASSET_NAME" ]]; then
            echo "Published asset name mismatch: expected $ASSET_NAME, got $ASSET_NAME_FOUND" >&2
            exit 1
          fi
          if [[ "$ASSET_SIZE" != "$ROM_SIZE" ]]; then
            echo "Published asset size mismatch: expected $ROM_SIZE, got $ASSET_SIZE" >&2
            exit 1
          fi
          if [[ "$ASSET_DIGEST" != "sha256:$ROM_SHA256" ]]; then
            echo "Published asset SHA-256 mismatch: expected sha256:$ROM_SHA256, got $ASSET_DIGEST" >&2
            exit 1
          fi
          {
            echo "asset_url=$ASSET_URL"
            echo "asset_size=$ASSET_SIZE"
            echo "asset_sha256=$ROM_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "Verified published asset: $ASSET_URL"
          echo "SHA-256: $ROM_SHA256"
          echo "Size: $ASSET_SIZE bytes"

      - name: Update OTA manifest only after release asset verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          VERSION: ${{ inputs.version || '0.4.0-dev' }}
          ROM_SHA256: ${{ steps.asset.outputs.asset_sha256 }}
          ROM_SIZE: ${{ steps.asset.outputs.asset_size }}
          VERIFIED_ASSET_URL: ${{ steps.asset.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="ota/stable.json"
          API="repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH"
          CURRENT="$(gh api "$API?ref=main" --jq '.sha')"
          EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-unsigned.zip"
          if [[ "$VERIFIED_ASSET_URL" != "$EXPECTED_URL" ]]; then
            echo "Verified asset URL does not match requested release tag." >&2
            exit 1
          fi
          jq -n \
            --arg device "lavender" \
            --arg version "$VERSION" \
            --arg url "$EXPECTED_URL" \
            --arg sha256 "$ROM_SHA256" \
            --argjson size "$ROM_SIZE" \
            --arg changelog "Updated Lucid Setup app and privileged permissions; refreshed Lucid Wallpapers, Lucid About, Lucid boot animation, and System Updater integration; preserved Lucid runtime payloads. The updater verifies the ZIP SHA-256 and can stage a root-assisted install script for compatible TWRP/OrangeFox recovery. Physical-device installation and boot are not confirmed." \
            '{device:$device,version:$version,url:$url,sha256:$sha256,size:$size,changelog:$changelog}' \
            > "$RUNNER_TEMP/stable.json"
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/stable.json")"
          jq -n \
            --arg message "release: publish LucidOS $VERSION OTA manifest" \
            --arg content "$CONTENT" \
            --arg sha "$CURRENT" \
            '{message:$message,content:$content,sha:$sha,branch:"main"}' \
            > "$RUNNER_TEMP/update-manifest.json"
          gh api --method PUT "$API" --input "$RUNNER_TEMP/update-manifest.json" >/dev/null
          echo "Updated OTA manifest to $TAG after digest/size verification."

      - name: Verify raw OTA manifest points to this exact Build 4 asset
        env:
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          VERSION: ${{ inputs.version || '0.4.0-dev' }}
          ROM_SHA256: ${{ steps.asset.outputs.asset_sha256 }}
          ROM_SIZE: ${{ steps.asset.outputs.asset_size }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-unsigned.zip"
          RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/ota/stable.json"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$RAW_URL?cachebust=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/raw-stable.json"; then
              if jq -e --arg version "$VERSION" --arg url "$EXPECTED_URL" --arg sha "$ROM_SHA256" --argjson size "$ROM_SIZE" \
                '.device == "lavender" and .version == $version and .url == $url and .sha256 == $sha and .size == $size' \
                "$RUNNER_TEMP/raw-stable.json" >/dev/null; then
                cat "$RUNNER_TEMP/raw-stable.json"
                echo "Raw manifest verified against the published Build 4 asset."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Raw OTA manifest did not converge to the expected Build 4 URL/checksum/size." >&2
          cat "$RUNNER_TEMP/raw-stable.json" >&2 || true
          exit 1
\t' read -r ASSET_NAME_FOUND ASSET_SIZE ASSET_DIGEST ASSET_URL <<< "$ASSET_INFO"
          if [[ "$ASSET_NAME_FOUND" != "$ASSET_NAME" ]]; then
            echo "Published asset name mismatch: expected $ASSET_NAME, got $ASSET_NAME_FOUND" >&2
            exit 1
          fi
          if [[ "$ASSET_SIZE" != "$ROM_SIZE" ]]; then
            echo "Published asset size mismatch: expected $ROM_SIZE, got $ASSET_SIZE" >&2
            exit 1
          fi
          if [[ "$ASSET_DIGEST" != "sha256:$ROM_SHA256" ]]; then
            echo "Published asset SHA-256 mismatch: expected $ROM_SHA256, got $ASSET_DIGEST" >&2
            exit 1
          fi
          {
            echo "asset_url=$ASSET_URL"
            echo "asset_size=$ASSET_SIZE"
            echo "asset_sha256=$ROM_SHA256"
          } >> "$GITHUB_OUTPUT"
          echo "Verified published asset: $ASSET_URL"
          echo "SHA-256: $ROM_SHA256"
          echo "Size: $ASSET_SIZE bytes"

      - name: Update OTA manifest only after release asset verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          VERSION: ${{ inputs.version || '0.4.0-dev' }}
          ROM_SHA256: ${{ steps.asset.outputs.asset_sha256 }}
          ROM_SIZE: ${{ steps.asset.outputs.asset_size }}
          VERIFIED_ASSET_URL: ${{ steps.asset.outputs.asset_url }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="ota/stable.json"
          API="repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH"
          CURRENT="$(gh api "$API?ref=main" --jq '.sha')"
          EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-unsigned.zip"
          if [[ "$VERIFIED_ASSET_URL" != "$EXPECTED_URL" ]]; then
            echo "Verified asset URL does not match requested release tag." >&2
            exit 1
          fi
          jq -n \
            --arg device "lavender" \
            --arg version "$VERSION" \
            --arg url "$EXPECTED_URL" \
            --arg sha256 "$ROM_SHA256" \
            --argjson size "$ROM_SIZE" \
            --arg changelog "Updated Lucid Setup app and privileged permissions; refreshed Lucid Wallpapers, Lucid About, Lucid boot animation, and System Updater integration; preserved Lucid runtime payloads. The updater verifies the ZIP SHA-256 and can stage a root-assisted install script for compatible TWRP/OrangeFox recovery. Physical-device installation and boot are not confirmed." \
            '{device:$device,version:$version,url:$url,sha256:$sha256,size:$size,changelog:$changelog}' \
            > "$RUNNER_TEMP/stable.json"
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/stable.json")"
          jq -n \
            --arg message "release: publish LucidOS $VERSION OTA manifest" \
            --arg content "$CONTENT" \
            --arg sha "$CURRENT" \
            '{message:$message,content:$content,sha:$sha,branch:"main"}' \
            > "$RUNNER_TEMP/update-manifest.json"
          gh api --method PUT "$API" --input "$RUNNER_TEMP/update-manifest.json" >/dev/null
          echo "Updated OTA manifest to $TAG after digest/size verification."

      - name: Verify raw OTA manifest points to this exact Build 4 asset
        env:
          TAG: ${{ inputs.release_tag || 'lucid-android15-lavender-build-4' }}
          VERSION: ${{ inputs.version || '0.4.0-dev' }}
          ROM_SHA256: ${{ steps.asset.outputs.asset_sha256 }}
          ROM_SIZE: ${{ steps.asset.outputs.asset_size }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-unsigned.zip"
          RAW_URL="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/ota/stable.json"
          for attempt in $(seq 1 12); do
            if curl -fsSL "$RAW_URL?cachebust=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/raw-stable.json"; then
              if jq -e --arg version "$VERSION" --arg url "$EXPECTED_URL" --arg sha "$ROM_SHA256" --argjson size "$ROM_SIZE" \
                '.device == "lavender" and .version == $version and .url == $url and .sha256 == $sha and .size == $size' \
                "$RUNNER_TEMP/raw-stable.json" >/dev/null; then
                cat "$RUNNER_TEMP/raw-stable.json"
                echo "Raw manifest verified against the published Build 4 asset."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Raw OTA manifest did not converge to the expected Build 4 URL/checksum/size." >&2
          cat "$RUNNER_TEMP/raw-stable.json" >&2 || true
          exit 1
