name: Publish Updated LucidOS ROM and OTA Manifest

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful integrated ROM build workflow run ID
        required: true
        type: string
      artifact_name:
        description: Actions artifact containing the validated ROM ZIP
        required: true
        default: lucid-integrated-android15-rom
        type: string
      release_tag:
        description: New unique release tag
        required: true
        default: lucid-android15-lavender-build-2
        type: string
      version:
        description: Version shown in the System Updater
        required: true
        default: 0.2-dev
        type: string
      target_sha:
        description: Exact source commit SHA used to build the ROM
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Download exact ROM build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: incoming

      - name: Verify ROM ZIP and calculate checksum
        id: rom
        shell: bash
        run: |
          set -euo pipefail
          find incoming -maxdepth 3 -type f -printf '%p %s bytes\\n'
          ROM="$(find incoming -type f -name '*.zip' -size +1000M -print -quit)"
          if [[ -z "$ROM" ]]; then
            echo "No integrated ROM ZIP larger than 1 GB found in build artifact." >&2
            exit 1
          fi
          unzip -tq "$ROM"
          SHA="$(sha256sum "$ROM" | awk '{print $1}')"
          SIZE="$(stat -c %s "$ROM")"
          echo "rom_path=$ROM" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "ROM_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "ROM_SIZE=$SIZE" >> "$GITHUB_ENV"
          sha256sum "$ROM"

      - name: Create release if needed and upload the ROM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ inputs.target_sha }}
          ROM_PATH: ${{ steps.rom.outputs.rom_path }}
          ROM_SHA256: ${{ steps.rom.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to overwrite an existing release." >&2
            exit 1
          fi
          gh release create "$TAG" "$ROM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "LucidOS Android 15 — lavender $TAG" \
            --prerelease \
            --target "$TARGET_SHA" \
            --notes "Updated LucidOS Android 15 integrated ROM for Xiaomi Redmi Note 7/7S (lavender). Version: $VERSION. Includes the latest Lucid Setup app, Lucid Wallpapers, Lucid About, generated Lucid boot animation, System Updater, and preserved Lucid runtime payloads. CI validates package integrity and partition round-trips; physical-device boot is not yet confirmed. Unsigned ZIP. Review recovery and firmware compatibility before flashing. SHA-256: $ROM_SHA256"

      - name: Verify release asset is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets,url,isDraft
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name == "LucidOS-Android15-lavender-unsigned.zip") | [.name,.size,.url] | @tsv' | grep -q .

      - name: Update OTA manifest only after release asset verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          ROM_SHA256: ${{ steps.rom.outputs.sha256 }}
          ROM_SIZE: ${{ steps.rom.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_PATH="ota/stable.json"
          API="repos/$GITHUB_REPOSITORY/contents/$MANIFEST_PATH"
          CURRENT="$(gh api "$API" --jq '.sha')"
          cat > "$RUNNER_TEMP/stable.json" <<EOF
          {
            "device": "lavender",
            "version": "$VERSION",
            "url": "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/LucidOS-Android15-lavender-unsigned.zip",
            "sha256": "$ROM_SHA256",
            "size": $ROM_SIZE,
            "changelog": "Updated Lucid Setup app and privileged permissions; refreshed Lucid Wallpapers, Lucid About, Lucid boot animation, and System Updater integration; preserved Lucid runtime payloads. Download is hash-verified by the updater. This app downloads but does not flash the ROM; a compatible recovery is required. Physical-device boot is not confirmed."
          }
          EOF
          CONTENT="$(base64 -w0 "$RUNNER_TEMP/stable.json")"
          jq -n --arg message "release: publish LucidOS $VERSION OTA manifest" --arg content "$CONTENT" --arg sha "$CURRENT" '{message:$message,content:$content,sha:$sha,branch:"main"}' > "$RUNNER_TEMP/payload.json"
          gh api --method PUT "$API" --input "$RUNNER_TEMP/payload.json" >/dev/null
          gh api "$API?ref=main" --jq '.content.download_url'
          echo "OTA manifest updated to $TAG with SHA-256 $ROM_SHA256"
