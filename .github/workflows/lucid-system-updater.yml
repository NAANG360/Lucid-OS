name: Lucid System Updater APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['theme/updater/**', '.github/workflows/lucid-system-updater.yml']
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools build-tools;35.0.0 platforms;android-35" }
      - name: Build and verify updater APK
        run: |
          set -euo pipefail
          mkdir -p out
          gradle -p theme/updater --no-daemon assembleDebug
          APK=theme/updater/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee out/certificates.txt
          cp "$APK" out/LucidSystemUpdater.apk
          sha256sum out/LucidSystemUpdater.apk | tee out/SHA256SUMS.txt
          VERSION_CODE="$(grep -oE 'versionCode [0-9]+' theme/updater/app/build.gradle | awk '{print $2}')"
          VERSION_NAME=$(grep -oE "versionName '[^']+'" theme/updater/app/build.gradle | cut -d "'" -f2)
          APK_SHA="$(sha256sum out/LucidSystemUpdater.apk | awk '{print $1}')"
          jq -n --arg packageName "com.lucid.os.updater" --arg versionName "$VERSION_NAME" --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/lucid-system-updater-root-0.3-dev/LucidSystemUpdater.apk" --arg sha256 "$APK_SHA" --argjson versionCode "$VERSION_CODE" '{packageName:$packageName,versionName:$versionName,versionCode:$versionCode,url:$url,sha256:$sha256}' > out/LucidSystemUpdater-update.json
          cat out/LucidSystemUpdater-update.json
      - name: Package correctly located system-app migration ZIP
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/updater-zip"
          mkdir -p "$STAGE/META-INF/com/google/android" "$STAGE/system_ext/priv-app/LucidSystemUpdater"
          cp out/LucidSystemUpdater.apk "$STAGE/system_ext/priv-app/LucidSystemUpdater/LucidSystemUpdater.apk"
          cat > "$STAGE/META-INF/com/google/android/updater-script" <<'EOF'
          ui_print(" ");
          ui_print("  L U C I D   O S");
          ui_print("  System Updater installer");
          ui_print(" ");
          assert(getprop("ro.product.device") == "lavender" || getprop("ro.build.product") == "lavender" || abort("This package is only for Redmi Note 7 (lavender)."));
          ifelse(is_mounted("/system_ext"), unmount("/system_ext"));
          mount("ext4", "EMMC", map_partition("system_ext"), "/system_ext");
          delete_recursive("/system_ext/app/LucidSystemUpdater");
          package_extract_dir("system_ext", "/system_ext");
          set_metadata_recursive("/system_ext/priv-app/LucidSystemUpdater", "uid", 0, "gid", 0, "dmode", 0755, "fmode", 0644, "selabel", "u:object_r:system_file:s0");
          unmount("/system_ext");
          ui_print("Lucid System Updater replaced in /system_ext/priv-app. Reboot to Android.");
          EOF
          (cd "$STAGE" && zip -qr -X "$GITHUB_WORKSPACE/out/LucidSystemUpdater-lavender-addon.zip" .)
          unzip -t out/LucidSystemUpdater-lavender-addon.zip
          unzip -Z -1 out/LucidSystemUpdater-lavender-addon.zip | tee out/installer-files.txt
          grep -Fxq 'system_ext/priv-app/LucidSystemUpdater/LucidSystemUpdater.apk' out/installer-files.txt
          if grep -Fxq 'system_ext/app/LucidSystemUpdater/LucidSystemUpdater.apk' out/installer-files.txt; then
            echo "Unexpected legacy /system_ext/app path in addon ZIP." >&2
            exit 1
          fi
          unzip -p out/LucidSystemUpdater-lavender-addon.zip META-INF/com/google/android/updater-script | grep -Fq '/system_ext/priv-app/LucidSystemUpdater'
          sha256sum out/LucidSystemUpdater-lavender-addon.zip | tee out/installer-sha256.txt
      - uses: actions/upload-artifact@v4
        with: { name: LucidSystemUpdater-debug-apk-and-recovery-installer, path: 'out/*', if-no-files-found: error, retention-days: 30 }
      - name: Publish updater APK and recovery installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=lucid-system-updater-root-0.3-dev
          VERSION_CODE="$(grep -oE 'versionCode [0-9]+' theme/updater/app/build.gradle | awk '{print $2}')"
          VERSION_NAME=$(grep -oE "versionName '[^']+'" theme/updater/app/build.gradle | cut -d "'" -f2)
          NOTES="Lucid System Updater $VERSION_NAME (versionCode $VERSION_CODE). Includes the editorial Lucid UI, root-managed updater self-update path, manifest package/version validation, SHA-256 verification, and a recovery installer for /system_ext/priv-app/LucidSystemUpdater. The APK is development-signed; direct APK updates may be rejected if its signing certificate differs from the installed app. For a system-app migration, use the recovery ZIP from compatible TWRP/OrangeFox. Recovery installation and Magisk self-update have not been tested on physical hardware."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/LucidSystemUpdater.apk out/SHA256SUMS.txt out/LucidSystemUpdater-lavender-addon.zip out/LucidSystemUpdater-update.json --repo "$GITHUB_REPOSITORY" --clobber
            RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f name="Lucid System Updater $VERSION_NAME" -f body="$NOTES"
          else
            gh release create "$TAG" out/LucidSystemUpdater.apk out/SHA256SUMS.txt out/LucidSystemUpdater-lavender-addon.zip out/LucidSystemUpdater-update.json \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lucid System Updater $VERSION_NAME" \
              --notes "$NOTES"
            RELEASE_ID="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=false -f name="Lucid System Updater $VERSION_NAME" -f body="$NOTES"
          fi
