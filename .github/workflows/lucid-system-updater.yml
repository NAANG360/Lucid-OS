name: Lucid System Updater APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['theme/updater/**', '.github/workflows/lucid-system-updater.yml']
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with: { packages: "platform-tools build-tools;35.0.0 platforms;android-35" }
      - name: Build, verify and package updater installer
        run: |
          set -euo pipefail
          gradle -p theme/updater --no-daemon assembleDebug
          APK=theme/updater/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | tee out-certificates.txt
          mkdir -p out
          cp "$APK" out/LucidSystemUpdater.apk
          sha256sum out/LucidSystemUpdater.apk | tee out/SHA256SUMS.txt
          STAGE="$RUNNER_TEMP/updater-zip"
          mkdir -p "$STAGE/META-INF/com/google/android" "$STAGE/system_ext/app/LucidSystemUpdater"
          cp out/LucidSystemUpdater.apk "$STAGE/system_ext/app/LucidSystemUpdater/LucidSystemUpdater.apk"
          cat > "$STAGE/META-INF/com/google/android/updater-script" <<'EOF'
          ui_print(" ");
          ui_print("  L U C I D   O S");
          ui_print("  System Updater app installer");
          ui_print(" ");
          assert(getprop("ro.product.device") == "lavender" || getprop("ro.build.product") == "lavender" || abort("This package is only for Redmi Note 7 (lavender)."));
          ifelse(is_mounted("/system_ext"), unmount("/system_ext"));
          mount("ext4", "EMMC", map_partition("system_ext"), "/system_ext");
          package_extract_dir("system_ext", "/system_ext");
          set_metadata_recursive("/system_ext/app/LucidSystemUpdater", "uid", 0, "gid", 0, "dmode", 0755, "fmode", 0644, "selabel", "u:object_r:system_file:s0");
          unmount("/system_ext");
          ui_print("Lucid System Updater installed. Reboot to Android.");
          EOF
          (cd "$STAGE" && zip -qr -X "$GITHUB_WORKSPACE/out/LucidSystemUpdater-lavender-addon.zip" .)
          unzip -t out/LucidSystemUpdater-lavender-addon.zip
          unzip -Z -1 out/LucidSystemUpdater-lavender-addon.zip | tee out/installer-files.txt
          sha256sum out/LucidSystemUpdater-lavender-addon.zip | tee out/installer-sha256.txt
      - uses: actions/upload-artifact@v4
        with: { name: LucidSystemUpdater-debug-apk, path: 'out/*', if-no-files-found: error, retention-days: 30 }
      - name: Publish updater APK and recovery installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=lucid-system-updater-root-0.3-dev
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" out/LucidSystemUpdater.apk out/SHA256SUMS.txt out/LucidSystemUpdater-lavender-addon.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Lucid System Updater — root-assisted 0.3.1-dev" --notes "Development build 0.3.1-dev (versionCode 2). APK is development-signed. Since Android rejects APK updates signed by a different certificate, use the recovery-flashable lavender addon ZIP if APK installation reports a signature conflict. Recovery compatibility and installation on physical devices remain unverified."
          else
            gh release create "$TAG" out/LucidSystemUpdater.apk out/SHA256SUMS.txt out/LucidSystemUpdater-lavender-addon.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "Lucid System Updater — root-assisted 0.3.1-dev" \
              --prerelease \
              --notes "Development build 0.3.1-dev (versionCode 2). APK is development-signed. Since Android rejects APK updates signed by a different certificate, use the recovery-flashable lavender addon ZIP if APK installation reports a signature conflict. Recovery compatibility and installation on physical devices remain unverified."
          fi
