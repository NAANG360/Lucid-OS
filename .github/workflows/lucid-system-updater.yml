name: Lucid System Updater APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['theme/updater/**', '.github/workflows/lucid-system-updater.yml']
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools,build-tools;35.0.0,platforms;android-35' }
      - name: Build and verify updater
        run: |
          set -euo pipefail
          gradle -p theme/updater --no-daemon assembleDebug
          APK=theme/updater/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p out
          cp "$APK" out/LucidSystemUpdater.apk
          sha256sum out/LucidSystemUpdater.apk | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: { name: LucidSystemUpdater-debug-apk, path: 'out/*', if-no-files-found: error, retention-days: 30 }
