name: LucidOS Available Components Bundle

# Deliberately produces a validated component bundle, NOT a flashable ROM/recovery ZIP.
# The current repository lacks a verified complete ROM/product filesystem and a validated installer.

concurrency:
  group: lucid-components-bundle-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/lucid-theme-pack.yml
  workflow_run:
    workflows: ["Lucid Theme Overlay"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  bundle:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,build-tools;35.0.0,platforms;android-35'

      - name: Build Lucid System Updater
        run: |
          set -euo pipefail
          gradle -p theme/updater --no-daemon assembleDebug
          APK=theme/updater/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/lucid-updater"
          cp "$APK" "$RUNNER_TEMP/lucid-updater/LucidSystemUpdater.apk"
          sha256sum "$RUNNER_TEMP/lucid-updater/LucidSystemUpdater.apk" > "$RUNNER_TEMP/lucid-updater/SHA256SUMS.txt"

      - name: Resolve successful theme build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ -n "${SOURCE_RUN_ID:-}" ]]; then
            RUN_ID="$SOURCE_RUN_ID"
          else
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lucid-theme-overlay.yml/runs?status=success&per_page=20" --jq '[.workflow_runs[] | select(.conclusion=="success")][0].id // empty')"
          fi
          test -n "$RUN_ID" || { echo "No successful Lucid Theme Overlay run is available yet."; exit 1; }
          echo "$RUN_ID" > source-run.txt
          mkdir -p "$RUNNER_TEMP/lucid-components"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name lucid-theme-overlay-prototype --dir "$RUNNER_TEMP/lucid-components"
          test -s "$RUNNER_TEMP/lucid-components/out/LucidWallpapers.apk"
          test -s "$RUNNER_TEMP/lucid-components/out/LucidOS-bootanimation.zip"
          echo "SOURCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Assemble and verify available components
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE/apps/LucidWallpapers" "$STAGE/apps/LucidSystemUpdater" "$STAGE/media" "$STAGE/reports"
          cp "$RUNNER_TEMP/lucid-updater/LucidSystemUpdater.apk" "$STAGE/apps/LucidSystemUpdater/LucidSystemUpdater.apk"
          cp "$RUNNER_TEMP/lucid-updater/SHA256SUMS.txt" "$STAGE/apps/LucidSystemUpdater/SHA256SUMS.txt"
          cp "$RUNNER_TEMP/lucid-components/out/LucidWallpapers.apk" "$STAGE/apps/LucidWallpapers/LucidWallpapers.apk"
          cp "$RUNNER_TEMP/lucid-components/out/LucidOS-bootanimation.zip" "$STAGE/media/bootanimation.zip"
          if [[ -f "$RUNNER_TEMP/lucid-components/out/LucidOS-Framework-Theme-Overlay.apk" ]]; then
            mkdir -p "$STAGE/optional-test-only"
            cp "$RUNNER_TEMP/lucid-components/out/LucidOS-Framework-Theme-Overlay.apk" "$STAGE/optional-test-only/"
            echo "Framework overlay is experimental; runtime overlay policy is not verified. Do not install as a system overlay." > "$STAGE/optional-test-only/README.txt"
          fi
          if [[ -d "$RUNNER_TEMP/lucid-components/report" ]]; then
            cp -R "$RUNNER_TEMP/lucid-components/report/." "$STAGE/reports/"
          fi
          cat > "$STAGE/README.txt" <<'EOF'
LucidOS Available Components — DEVELOPMENT BUNDLE

Included:
- LucidWallpapers.apk: development-signed wallpaper app.
- LucidSystemUpdater.apk: development-signed updater UI; checks the OTA manifest and verifies downloaded file SHA-256. It does not itself flash an OTA.
- media/bootanimation.zip: generated LucidOS boot animation.
- reports/: cloud build and validation reports.
- optional-test-only/: experimental static framework overlay, if present.

IMPORTANT:
This is NOT a flashable ROM or recovery ZIP. Do not flash it in recovery.
The launcher source/APK has not yet been supplied, so it is not included.
The repository does not yet contain a verified complete ROM source tree and the product OTA payload is known to be incomplete. Bootability and OTA installation are unverified.
The APK is development-signed and may not update/replace an existing differently signed package.
EOF
          (
            cd "$STAGE"
            find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          mkdir -p out
          (cd "$STAGE" && zip -qr -X "$GITHUB_WORKSPACE/out/LucidOS-Available-Components.zip" .)
          unzip -t out/LucidOS-Available-Components.zip
          unzip -Z -1 out/LucidOS-Available-Components.zip | tee out/bundle-files.txt
          sha256sum out/LucidOS-Available-Components.zip | tee out/bundle-sha256.txt
          test -s out/LucidOS-Available-Components.zip

      - name: Upload one ready-to-download bundle
        uses: actions/upload-artifact@v4
        with:
          name: LucidOS-Available-Components
          path: |
            out/LucidOS-Available-Components.zip
            out/bundle-files.txt
            out/bundle-sha256.txt
            source-run.txt
          if-no-files-found: error
          retention-days: 30
