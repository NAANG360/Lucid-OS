name: Inspect Lucid OTA Vendor and ODM Partitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-partitions:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download and verify the exact OTA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit extracted mount/vendor mount/odm
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ota/stable.json?ref=main" \
            -o "$RUNNER_TEMP/manifest-response.json"
          python3 - "$RUNNER_TEMP/manifest-response.json" "$RUNNER_TEMP/manifest.json" <<'PY'
          import base64,json,sys
          obj=json.load(open(sys.argv[1]))
          open(sys.argv[2],"wb").write(base64.b64decode(obj["content"]))
          PY
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["device"]=="lavender"
          assert m["url"].endswith("LucidOS-Android15-lavender-build-4-experimental.zip")
          print(m["url"],m["sha256"],m["size"])
          PY
          URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "$RUNNER_TEMP/manifest.json")"
          SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/manifest.json")"
          SIZE="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["size"])' "$RUNNER_TEMP/manifest.json")"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$URL" -o "$RUNNER_TEMP/ota.zip"
          test "$(stat -c %s "$RUNNER_TEMP/ota.zip")" = "$SIZE"
          echo "$SHA  $RUNNER_TEMP/ota.zip" | sha256sum -c -
          echo "Verified OTA: size=$SIZE sha256=$SHA" | tee audit/asset-verification.txt

      - name: Reconstruct vendor and odm ext4 images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y brotli e2fsprogs
          python3 - "$RUNNER_TEMP/ota.zip" "$RUNNER_TEMP/parts" <<'PY'
          import os,sys,zipfile
          zpath,out=sys.argv[1:]
          os.makedirs(out,exist_ok=True)
          with zipfile.ZipFile(zpath) as z:
              for part in ("vendor","odm"):
                  for suffix in ("new.dat.br","transfer.list"):
                      name=f"{part}.{suffix}"
                      with z.open(name) as src,open(os.path.join(out,name),"wb") as dst:
                          while True:
                              b=src.read(4*1024*1024)
                              if not b:break
                              dst.write(b)
          PY
          for part in vendor odm; do
            brotli --decompress --force --output="$RUNNER_TEMP/parts/$part.new.dat" "$RUNNER_TEMP/parts/$part.new.dat.br"
          done
          python3 - "$RUNNER_TEMP/parts" <<'PY'
          import os,sys
          root=sys.argv[1]; block=4096
          for part in ("vendor","odm"):
              lines=open(os.path.join(root,part+".transfer.list")).read().splitlines()
              version=int(lines[0]); total=int(lines[1])
              outpath=os.path.join(root,part+".img")
              with open(outpath,"wb") as out: out.truncate(total*block)
              data_path=os.path.join(root,part+".new.dat")
              consumed=0
              with open(data_path,"rb") as src,open(outpath,"r+b") as out:
                  for line in lines[4:]:
                      if not line.strip():continue
                      op,rest=line.split(" ",1)
                      if op in ("zero","erase"):continue
                      if op!="new":raise SystemExit(f"{part}: unsupported transfer op {op}")
                      nums=[int(x) for x in rest.split(",")]
                      count=nums[0]
                      if count%2 or count+1!=len(nums):raise SystemExit(f"{part}: malformed range {line}")
                      for j in range(1,len(nums),2):
                          start,end=nums[j:j+2]
                          out.seek(start*block)
                          remain=(end-start)*block
                          while remain:
                              chunk=src.read(min(4*1024*1024,remain))
                              if not chunk:raise SystemExit(f"{part}: truncated .new.dat stream")
                              out.write(chunk);remain-=len(chunk);consumed+=len(chunk)
              if consumed!=os.path.getsize(data_path):
                  raise SystemExit(f"{part}: stream bytes consumed {consumed}, file size {os.path.getsize(data_path)}")
              if os.path.getsize(outpath)!=total*block:raise SystemExit(f"{part}: image size mismatch")
              print(f"{part}: transfer-list v{version}, blocks={total}, image_bytes={total*block}, stream_bytes={consumed}")
          PY
          file "$RUNNER_TEMP/parts/vendor.img" "$RUNNER_TEMP/parts/odm.img" | tee audit/partition-file-types.txt
          e2fsck -fn "$RUNNER_TEMP/parts/vendor.img" > audit/vendor-e2fsck.txt 2>&1 || true
          e2fsck -fn "$RUNNER_TEMP/parts/odm.img" > audit/odm-e2fsck.txt 2>&1 || true

      - name: Inventory vendor and odm drivers, firmware, and init configuration
        shell: bash
        run: |
          set -euo pipefail
          sudo mount -o loop,ro,noload "$RUNNER_TEMP/parts/vendor.img" mount/vendor
          sudo mount -o loop,ro,noload "$RUNNER_TEMP/parts/odm.img" mount/odm
          {
            echo "=== VENDOR TOP LEVEL ==="
            find mount/vendor -maxdepth 2 -mindepth 1 -printf '%y %p %s\n' | sort
            echo
            echo "=== VENDOR KERNEL MODULES ==="
            find mount/vendor -type f \( -name '*.ko' -o -name 'modules.load*' -o -name 'modules.dep' -o -name 'modules.alias' -o -name 'modules.softdep' \) -printf '%p %s bytes\n' | sort
            echo
            echo "=== VENDOR HARDWARE FIRMWARE CANDIDATES ==="
            find mount/vendor -type f | grep -Ei '/(firmware|modules)/|nvt|novatek|synaptics|touch|nt36672|td4320|mdss|kgsl|adreno|gpu|wlan|wifi|bluetooth|camera|qcom' | sort | head -n 12000 || true
            echo
            echo "=== VENDOR INIT AND VINTF FILES ==="
            find mount/vendor/etc -type f \( -name '*.rc' -o -name '*.xml' -o -name '*.json' -o -name '*.prop' -o -name '*.conf' \) -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 12000 || true
          } > audit/vendor-inventory.txt
          {
            echo "=== ODM TOP LEVEL ==="
            find mount/odm -maxdepth 3 -mindepth 1 -printf '%y %p %s\n' | sort
            echo
            echo "=== ODM DRIVER / FIRMWARE CANDIDATES ==="
            find mount/odm -type f | grep -Ei 'nvt|novatek|synaptics|touch|nt36672|td4320|mdss|kgsl|adreno|gpu|wlan|wifi|bluetooth|camera|firmware|\.ko$|modules\.' | sort | head -n 12000 || true
          } > audit/odm-inventory.txt
          grep -RaiE -m 3 'novatek|NVT-ts|synaptics|nt36672|td4320|NVTCapacitiveTouchScreen|kgsl|adreno' mount/vendor/etc mount/odm/etc 2>/dev/null | head -n 3000 > audit/hardware-config-matches.txt || true
          sudo umount mount/odm
          sudo umount mount/vendor
          rm -f "$RUNNER_TEMP/parts/"*.img "$RUNNER_TEMP/parts/"*.new.dat "$RUNNER_TEMP/ota.zip"

      - name: Upload partition inspection report
        if: always()
        run: |
          {
            echo "# Lucid OTA vendor and ODM inspection"
            for f in audit/*; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f")"
              echo '~~~'
              head -n 600 "$f"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: actual-lucid-vendor-odm-inspection
          path: audit/
          if-no-files-found: error
          retention-days: 14
