name: Lucid Full App Emulator Screenshots
# Capture output is stored under /data/local/tmp for reliable adb pull permissions.
# QA rerun after fixing remote capture paths.
on:
  push:
    branches: ['**']
    paths:
      - '.github/workflows/lucid-all-apps-emulator.yml'
      - 'theme/**'
      - 'tools/build_lucid_apps.sh'
      - 'tools/test_lucid_apps_emulator.sh'
  pull_request:
    paths:
      - '.github/workflows/lucid-all-apps-emulator.yml'
      - 'theme/**'
      - 'tools/build_lucid_apps.sh'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          set -eu
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Rebuild every Lucid app from current source
        run: |
          set -euo pipefail
          bash tools/build_lucid_apps.sh "$GITHUB_WORKSPACE/out/lucid-apps"
          test "$(find out/lucid-apps -maxdepth 1 -name '*.apk' | wc -l)" -eq 7
          mkdir -p report/emulator
          cp out/lucid-apps/app-inventory.txt report/emulator/
      - name: Boot Android 15 emulator, install and launch all seven apps
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data -memory 4096 -cores 4
          disable-animations: true
          emulator-boot-timeout: 1800
          script: |
            set -eu
            bash -x tools/test_lucid_apps_emulator.sh
      - name: Upload APKs, screenshots and emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-all-apps-emulator-screenshots
          path: |
            out/lucid-apps/
            report/emulator/
          if-no-files-found: warn
          retention-days: 30
