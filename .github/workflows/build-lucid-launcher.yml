name: Build Lucid Launcher APK
on:
  push:
    branches: [feature/lucid-control-centre-connect]
    paths: ['theme/lucid-launcher/**', '.github/workflows/build-lucid-launcher.yml']
  pull_request:
    paths: ['theme/lucid-launcher/**', '.github/workflows/build-lucid-launcher.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Configure Android SDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package, and verify
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/theme/lucid-launcher"
          OUT="$RUNNER_TEMP/lucid-launcher"
          mkdir -p "$OUT/classes" "$OUT/dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d "$OUT/classes" "$APP/src/com/lucid/os/launcher/MainActivity.java"
          mapfile -t CLASS_FILES < <(find "$OUT/classes" -type f -name '*.class' -print | sort)
          test "${#CLASS_FILES[@]}" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$OUT/dex" "${CLASS_FILES[@]}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f -M "$APP/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-35/android.jar" -F "$OUT/Lucid-Launcher-unsigned.apk"
          cp "$OUT/dex/classes.dex" "$OUT/classes.dex"
          (cd "$OUT" && zip -q "$OUT/Lucid-Launcher-unsigned.apk" classes.dex)
          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Lucid OS Debug,O=Lucid,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/Lucid-Launcher.apk" "$OUT/Lucid-Launcher-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT/Lucid-Launcher.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/Lucid-Launcher.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: lucid-launcher-apk
          path: ${{ runner.temp }}/lucid-launcher/Lucid-Launcher.apk
          if-no-files-found: error
          retention-days: 14