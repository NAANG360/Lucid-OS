name: Inspect Actual Lucid OTA ROM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Download and verify the exact OTA manifest asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit extracted
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ota/stable.json?ref=main" \
            -o "$RUNNER_TEMP/manifest-response.json"
          python3 - "$RUNNER_TEMP/manifest-response.json" "$RUNNER_TEMP/manifest.json" <<'PY'
          import base64,json,sys
          obj=json.load(open(sys.argv[1]))
          open(sys.argv[2],"wb").write(base64.b64decode(obj["content"]))
          PY
          python3 - "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/asset.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["device"]=="lavender",m
          assert m["url"].endswith("LucidOS-Android15-lavender-build-4-experimental.zip"),m["url"]
          a={"url":m["url"],"sha256":m["sha256"],"size":m["size"],"version":m["version"]}
          json.dump(a,open(sys.argv[2],"w"))
          print(json.dumps(a,indent=2))
          PY
          URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "$RUNNER_TEMP/asset.json")"
          EXPECTED_SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/asset.json")"
          EXPECTED_SIZE="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["size"])' "$RUNNER_TEMP/asset.json")"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$URL" -o "$RUNNER_TEMP/lucidos-ota.zip"
          ACTUAL_SIZE="$(stat -c %s "$RUNNER_TEMP/lucidos-ota.zip")"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/lucidos-ota.zip" | cut -d' ' -f1)"
          test "$ACTUAL_SIZE" = "$EXPECTED_SIZE"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          {
            echo "manifest_version: $(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["version"])' "$RUNNER_TEMP/asset.json")"
            echo "asset_url: $URL"
            echo "expected_size: $EXPECTED_SIZE"
            echo "actual_size: $ACTUAL_SIZE"
            echo "expected_sha256: $EXPECTED_SHA"
            echo "actual_sha256: $ACTUAL_SHA"
            echo "integrity: PASS"
          } | tee audit/asset-verification.txt

      - name: Inventory actual OTA archive and extract boot-critical evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/lucidos-ota.zip" audit extracted <<'PY'
          import hashlib,os,re,sys,zipfile
          zp,audit,out=sys.argv[1:]
          os.makedirs(out,exist_ok=True)
          text_re=re.compile(r'(^|/)([^/]*\.rc|[^/]*\.prop|[^/]*fstab[^/]*|[^/]*\.conf|[^/]*\.xml|[^/]*\.json|modules\.(load|dep)|modules\.alias|ueventd[^/]*\.rc|updater-script|dynamic_partitions_op_list|[^/]*\.mk)$',re.I)
          critical_re=re.compile(r'(boot|vendor_boot|init_boot|dtbo|vbmeta|vendor|odm|system|product|system_ext|firmware|modem|dsp|touch|panel|display|gpu|kgsl|wlan|wifi|bluetooth|audio|camera|fstab|modules|\.ko($|\.)|\.dtb$|\.dtbo$)',re.I)
          with zipfile.ZipFile(zp) as z:
              infos=z.infolist()
              with open(os.path.join(audit,'ota-archive-index.txt'),'w') as f:
                  f.write(f'entries={len(infos)}\n')
                  for i in infos:
                      if critical_re.search(i.filename):
                          f.write(f'{i.file_size:12d} {i.compress_size:12d} {i.filename}\n')
              with open(os.path.join(audit,'ota-text-configs.txt'),'w') as f:
                  total=0
                  for i in infos:
                      if i.is_dir() or i.file_size>512_000 or not text_re.search(i.filename): continue
                      if total>25_000_000: f.write('\n[TEXT EXTRACTION STOPPED AT 25MB]\n'); break
                      try:
                          b=z.read(i); total+=len(b)
                          f.write(f'\n===== {i.filename} ({len(b)} bytes) =====\n')
                          f.write(b.decode('utf-8','replace')[:512_000]+'\n')
                      except Exception as e: f.write(f'\n===== {i.filename}: {e} =====\n')
              with open(os.path.join(audit,'partition-image-candidates.txt'),'w') as f:
                  for i in infos:
                      if re.search(r'(^|/)(boot|vendor_boot|init_boot|dtbo|vbmeta|vendor|odm|system|product|system_ext|recovery)[^/]*\.img$',i.filename,re.I):
                          f.write(f'{i.file_size:12d} {i.filename}\n')
              wanted=('boot.img','vendor_boot.img','init_boot.img','dtbo.img','vbmeta.img','recovery.img')
              for name in wanted:
                  matches=[i for i in infos if i.filename.rsplit('/',1)[-1]==name]
                  for idx,i in enumerate(matches):
                      dst=os.path.join(out,name if idx==0 else f'{idx}-{name}')
                      h=hashlib.sha256()
                      with z.open(i) as src,open(dst,'wb') as w:
                          while True:
                              b=src.read(4*1024*1024)
                              if not b: break
                              h.update(b);w.write(b)
                      with open(os.path.join(audit,'boot-binary-hashes.txt'),'a') as f:
                          f.write(f'{h.hexdigest()}  {i.filename} ({i.file_size} bytes)\n')
              with open(os.path.join(audit,'archive-root-and-installer.txt'),'w') as f:
                  for i in infos:
                      if '/' not in i.filename.rstrip('/'): f.write(i.filename+'\n')
          print(f'Indexed {len(infos)} entries')
          PY
          file extracted/* > audit/extracted-boot-file-types.txt 2>&1 || true
          for f in extracted/boot.img extracted/vendor_boot.img extracted/init_boot.img; do
            if [ -f "$f" ]; then
              python3 tools/inspect_boot_image.py "$f" audit
            fi
          done
          unzip -t "$RUNNER_TEMP/lucidos-ota.zip" | tail -n 3 > audit/zip-integrity.txt

      - name: Publish inspection report
        if: always()
        run: |
          {
            echo "# Actual Lucid OTA inspection"
            for f in audit/*; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f")"
              echo '~~~'
              head -n 500 "$f"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: actual-lucid-ota-inspection
          path: |
            audit/
            extracted/
          if-no-files-found: error
          retention-days: 14
