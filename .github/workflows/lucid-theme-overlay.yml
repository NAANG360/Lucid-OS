name: Lucid Theme Overlay

concurrency:
  group: lucid-theme-overlay-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, lucid-ui-foundation]
    paths:
      - theme/rro/**
      - theme/assets/**
      - theme/wallpaper-app/**
      - theme/control-center-app/**
      - theme/settings-app/**
      - theme/LUCID_UI_FOUNDATION.md
      - theme/scripts/**
      - theme/profiles.json
      - theme/package.json
      - theme/package-lock.json
      - tools/generate_bootanimation.py
      - .github/workflows/lucid-theme-overlay.yml

permissions:
  contents: read

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Install Android API 35 platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35"

      - name: Generate LucidOS tonal palette
        working-directory: theme
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run generate-palette

      - name: Compile and validate framework overlay
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          mkdir -p out report
          {
            echo "LucidOS RRO build"
            date -u
            echo
            echo "=== Target framework ==="
            ls -lh system-tree/system/framework/framework-res.apk
            sha256sum system-tree/system/framework/framework-res.apk
            echo
            echo "=== Expected dynamic palette resources in target ==="
            "$AAPT2" dump resources system-tree/system/framework/framework-res.apk | grep -E 'color/system_(accent[123]|neutral[12])_(0|10|50|100|200|300|400|500|600|700|800|900|1000)' | head -n 80 || true
          } > report/build-report.txt

          if "$AAPT2" dump overlayable system-tree/system/framework/framework-res.apk > report/target-overlayable.txt 2>&1; then
            echo "Overlayable metadata captured."
          else
            echo "This aapt2 build-tools version does not expose dump overlayable; runtime policy remains to be checked." > report/target-overlayable.txt
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs system-tree/system/framework/framework-res.apk > report/framework-res-certificate.txt 2>&1 || true
          "$AAPT2" compile --dir theme/rro/res -o out/compiled-resources.zip
          "$AAPT2" link --manifest theme/rro/AndroidManifest.xml -I system-tree/system/framework/framework-res.apk --auto-add-overlay -o out/lucid-framework-overlay-unsigned.apk out/compiled-resources.zip

          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/lucid-overlay.jks" -storepass 'lucid-overlay-build' -keypass 'lucid-overlay-build' -alias lucid-overlay -keyalg RSA -keysize 2048 -validity 3650 -dname 'CN=LucidOS Development Overlay'
          "$BUILD_TOOLS/zipalign" -f 4 out/lucid-framework-overlay-unsigned.apk out/lucid-framework-overlay-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/lucid-overlay.jks" --ks-key-alias lucid-overlay --ks-pass pass:lucid-overlay-build --key-pass pass:lucid-overlay-build --out out/LucidOS-Framework-Theme-Overlay.apk out/lucid-framework-overlay-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose out/LucidOS-Framework-Theme-Overlay.apk
          "$BUILD_TOOLS/aapt" dump badging out/LucidOS-Framework-Theme-Overlay.apk > report/apk-badging.txt
          "$AAPT2" dump resources out/LucidOS-Framework-Theme-Overlay.apk > report/overlay-resources.txt
          sha256sum out/LucidOS-Framework-Theme-Overlay.apk > report/overlay-sha256.txt
          echo "Compile/sign validation succeeded. Static RRO is test-only and excluded from flashable packages until runtime mapping is verified; native dynamic palette controls are the shipping system-color path." >> report/build-report.txt

      - name: Test framework overlay mapping with AOSP idmap2
        shell: bash
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/aosp-tools" report
          if ! curl --fail --location --retry 2 --max-time 120 \
            "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/0a1270d749f286c168ac6bb120997471f029130a/linux-x86.tar.gz" \
            --output "$RUNNER_TEMP/aosp-tools.tar.gz"; then
            echo "AOSP host tools download failed; static RRO runtime mapping remains unverified." > report/idmap2-create.txt
            exit 0
          fi
          if ! tar -xzf "$RUNNER_TEMP/aosp-tools.tar.gz" -C "$RUNNER_TEMP/aosp-tools"; then
            echo "AOSP host tools archive could not be extracted; runtime mapping remains unverified." > report/idmap2-create.txt
            exit 0
          fi
          IDMAP2="$(find "$RUNNER_TEMP/aosp-tools" -type f -name idmap2 -print -quit)"
          if [[ -z "$IDMAP2" ]]; then
            echo "No host idmap2 binary found in the AOSP prebuilt bundle; runtime mapping remains unverified." > report/idmap2-create.txt
            exit 0
          fi
          chmod +x "$IDMAP2"
          TOOLS_ROOT="$(dirname "$(dirname "$IDMAP2")")"
          export LD_LIBRARY_PATH="$TOOLS_ROOT/lib64:$TOOLS_ROOT/lib:${LD_LIBRARY_PATH:-}"
          "$IDMAP2" --help > report/idmap2-help.txt 2>&1 || true
          set +e
          "$IDMAP2" create \
            --target-apk-path system-tree/system/framework/framework-res.apk \
            --overlay-apk-path out/LucidOS-Framework-Theme-Overlay.apk \
            --idmap-path "$RUNNER_TEMP/lucid-framework.idmap" \
            --policy public > report/idmap2-create.txt 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > report/idmap2-create-status.txt
          if [[ "$STATUS" -eq 0 && -s "$RUNNER_TEMP/lucid-framework.idmap" ]]; then
            echo "idmap2 created a mapping for the custom framework target." >> report/idmap2-create.txt
          else
            echo "idmap2 could not create a mapping; do not rely on the static RRO for system theming." >> report/idmap2-create.txt
          fi

      - name: Build Lucid Wallpapers app
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p out/wallpaper "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex" theme/wallpaper-app/assets
          cp theme/assets/lucid-wallpaper-dusk.jpg theme/wallpaper-app/assets/
          cp theme/assets/lucid-wallpaper-alpine.jpg theme/wallpaper-app/assets/
          "$BUILD_TOOLS/aapt2" compile --dir theme/wallpaper-app/res -o out/wallpaper/compiled-resources.zip
          "$BUILD_TOOLS/aapt2" link --manifest theme/wallpaper-app/AndroidManifest.xml -I "$ANDROID_JAR" -A theme/wallpaper-app/assets -o out/LucidWallpapers-unsigned.apk out/wallpaper/compiled-resources.zip
          mapfile -t JAVA_SOURCES < <(find theme/wallpaper-app/src -name '*.java' -print)
          javac -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -d "$RUNNER_TEMP/classes" "${JAVA_SOURCES[@]}"
          mapfile -t CLASS_FILES < <(find "$RUNNER_TEMP/classes" -name '*.class' -print)
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output "$RUNNER_TEMP/dex" "${CLASS_FILES[@]}"
          (cd "$RUNNER_TEMP/dex" && zip -q "$GITHUB_WORKSPACE/out/LucidWallpapers-unsigned.apk" classes.dex)
          "$BUILD_TOOLS/zipalign" -f 4 out/LucidWallpapers-unsigned.apk out/LucidWallpapers-aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/lucid-overlay.jks" --ks-key-alias lucid-overlay --ks-pass pass:lucid-overlay-build --key-pass pass:lucid-overlay-build --out out/LucidWallpapers.apk out/LucidWallpapers-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose out/LucidWallpapers.apk
          "$BUILD_TOOLS/aapt" dump badging out/LucidWallpapers.apk > report/wallpaper-app-badging.txt
          sha256sum out/LucidWallpapers.apk > report/wallpaper-app-sha256.txt

      - name: Build Lucid Control Center and Settings apps
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p out report
          build_lucid_app() {
            local APP_DIR="$1"
            local APP_NAME="$2"
            local PACKAGE="$3"
            local APP_OUT="out/$APP_NAME"
            local CLASSES="$RUNNER_TEMP/$APP_NAME-classes"
            local DEX="$RUNNER_TEMP/$APP_NAME-dex"
            mkdir -p "$APP_OUT" "$APP_OUT/gen" "$CLASSES" "$DEX"
            "$BUILD_TOOLS/aapt2" compile --dir "$APP_DIR/res" -o "$APP_OUT/compiled-resources.zip"
            "$BUILD_TOOLS/aapt2" link --manifest "$APP_DIR/AndroidManifest.xml" --java "$APP_OUT/gen" -I "$ANDROID_JAR" -o "$APP_OUT/$APP_NAME-unsigned.apk" "$APP_OUT/compiled-resources.zip"
            mapfile -t JAVA_SOURCES < <(find "$APP_DIR/src" "$APP_OUT/gen" -name '*.java' -print)
            javac -source 8 -target 8 -bootclasspath "$ANDROID_JAR" -d "$CLASSES" "${JAVA_SOURCES[@]}"
            mapfile -t CLASS_FILES < <(find "$CLASSES" -name '*.class' -print)
            "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output "$DEX" "${CLASS_FILES[@]}"
            (cd "$DEX" && zip -q "$GITHUB_WORKSPACE/$APP_OUT/$APP_NAME-unsigned.apk" classes.dex)
            "$BUILD_TOOLS/zipalign" -f 4 "$APP_OUT/$APP_NAME-unsigned.apk" "$APP_OUT/$APP_NAME-aligned.apk"
            "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/lucid-overlay.jks" --ks-key-alias lucid-overlay --ks-pass pass:lucid-overlay-build --key-pass pass:lucid-overlay-build --out "$APP_OUT/$APP_NAME.apk" "$APP_OUT/$APP_NAME-aligned.apk"
            "$BUILD_TOOLS/apksigner" verify --verbose "$APP_OUT/$APP_NAME.apk"
            "$BUILD_TOOLS/aapt" dump badging "$APP_OUT/$APP_NAME.apk" > "report/$APP_NAME-badging.txt"
            grep -q "package: name='$PACKAGE'" "report/$APP_NAME-badging.txt"
            sha256sum "$APP_OUT/$APP_NAME.apk" > "report/$APP_NAME-sha256.txt"
          }
          build_lucid_app theme/control-center-app LucidControlCenter com.lucid.os.controlcenter
          build_lucid_app theme/settings-app LucidSettings com.lucid.os.settings

      - name: Generate LucidOS boot animation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pillow-venv"
          "$RUNNER_TEMP/pillow-venv/bin/pip" install --quiet Pillow
          "$RUNNER_TEMP/pillow-venv/bin/python" tools/generate_bootanimation.py theme/assets/lucid-wallpaper-dusk.jpg out/LucidOS-bootanimation.zip
          unzip -t out/LucidOS-bootanimation.zip | tail -n 2
          ls -lh out/LucidOS-bootanimation.zip
          sha256sum out/LucidOS-bootanimation.zip > report/bootanimation-sha256.txt

      - name: Upload theme artifacts and validation report
        uses: actions/upload-artifact@v4
        with:
          name: lucid-theme-overlay-prototype
          path: |
            out/LucidOS-Framework-Theme-Overlay.apk
            out/LucidWallpapers.apk
            out/LucidControlCenter/LucidControlCenter.apk
            out/LucidSettings/LucidSettings.apk
            out/LucidOS-bootanimation.zip
            report/
          if-no-files-found: error
          retention-days: 7
