name: Lucid Theme Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - theme/rro/**
      - theme/assets/**
      - .github/workflows/lucid-theme-overlay.yml

permissions:
  contents: read

jobs:
  build-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: |
            build-tools;35.0.0
            platforms;android-35

      - name: Generate Figma-matched Material tonal palette
        working-directory: theme
        run: |
          npm install --no-audit --no-fund
          npm run generate-palette

      - name: Compile and validate framework overlay
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          AAPT2="$BUILD_TOOLS/aapt2"
          mkdir -p out report
          {
            echo "LucidOS RRO build"
            date -u
            echo
            echo "=== Target framework ==="
            ls -lh system-tree/system/framework/framework-res.apk
            sha256sum system-tree/system/framework/framework-res.apk
            echo
            echo "=== Expected dynamic palette resources in target ==="
            "$AAPT2" dump resources system-tree/system/framework/framework-res.apk | grep -E 'color/system_(accent[123]|neutral[12])_(0|10|50|100|200|300|400|500|600|700|800|900|1000)' | head -n 80
          } > report/build-report.txt

          if "$AAPT2" dump overlayable system-tree/system/framework/framework-res.apk > report/target-overlayable.txt 2>&1; then
            echo "Overlayable metadata captured."
          else
            echo "This aapt2 build-tools version does not expose dump overlayable; runtime policy remains to be checked." > report/target-overlayable.txt
          fi
          "$AAPT2" compile --dir theme/rro/res -o out/compiled-resources.zip
          "$AAPT2" link \
            --manifest theme/rro/AndroidManifest.xml \
            -I system-tree/system/framework/framework-res.apk \
            --auto-add-overlay \
            -o out/lucid-framework-overlay-unsigned.apk \
            out/compiled-resources.zip

          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/lucid-overlay.jks" \
            -storepass 'lucid-overlay-build' -keypass 'lucid-overlay-build' \
            -alias lucid-overlay -keyalg RSA -keysize 2048 -validity 3650 \
            -dname 'CN=LucidOS Development Overlay'
          "$BUILD_TOOLS/zipalign" -f 4 out/lucid-framework-overlay-unsigned.apk out/lucid-framework-overlay-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/lucid-overlay.jks" \
            --ks-key-alias lucid-overlay \
            --ks-pass pass:lucid-overlay-build \
            --key-pass pass:lucid-overlay-build \
            --out out/LucidOS-Framework-Theme-Overlay.apk \
            out/lucid-framework-overlay-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose out/LucidOS-Framework-Theme-Overlay.apk
          "$BUILD_TOOLS/aapt" dump badging out/LucidOS-Framework-Theme-Overlay.apk > report/apk-badging.txt
          "$AAPT2" dump resources out/LucidOS-Framework-Theme-Overlay.apk > report/overlay-resources.txt
          sha256sum out/LucidOS-Framework-Theme-Overlay.apk > report/overlay-sha256.txt
          echo "Compile/sign validation succeeded. Runtime overlay policy remains unverified." >> report/build-report.txt

      - name: Build Lucid Wallpapers app
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p out/wallpaper "$RUNNER_TEMP/classes" "$RUNNER_TEMP/dex" theme/wallpaper-app/assets
          cp theme/assets/lucid-wallpaper-dusk.jpg theme/wallpaper-app/assets/
          cp theme/assets/lucid-wallpaper-alpine.jpg theme/wallpaper-app/assets/
          "$BUILD_TOOLS/aapt2" compile --dir theme/wallpaper-app/res -o out/wallpaper/compiled-resources.zip
          "$BUILD_TOOLS/aapt2" link \
            --manifest theme/wallpaper-app/AndroidManifest.xml \
            -I "$ANDROID_JAR" \
            -A theme/wallpaper-app/assets \
            -o out/LucidWallpapers-unsigned.apk \
            out/wallpaper/compiled-resources.zip
          javac -source 8 -target 8 -bootclasspath "$ANDROID_JAR" \
            -d "$RUNNER_TEMP/classes" \
            $(find theme/wallpaper-app/src -name '*.java' -print)
          "$BUILD_TOOLS/d8" --lib "$ANDROID_JAR" --output "$RUNNER_TEMP/dex" \
            $(find "$RUNNER_TEMP/classes" -name '*.class' -print)
          (cd "$RUNNER_TEMP/dex" && zip -q "$GITHUB_WORKSPACE/out/LucidWallpapers-unsigned.apk" classes.dex)
          "$BUILD_TOOLS/zipalign" -f 4 out/LucidWallpapers-unsigned.apk out/LucidWallpapers-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/lucid-overlay.jks" \
            --ks-key-alias lucid-overlay \
            --ks-pass pass:lucid-overlay-build \
            --key-pass pass:lucid-overlay-build \
            --out out/LucidWallpapers.apk \
            out/LucidWallpapers-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose out/LucidWallpapers.apk
          "$BUILD_TOOLS/aapt" dump badging out/LucidWallpapers.apk > report/wallpaper-app-badging.txt
          sha256sum out/LucidWallpapers.apk > report/wallpaper-app-sha256.txt

      - name: Generate LucidOS boot animation
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pillow-venv"
          "$RUNNER_TEMP/pillow-venv/bin/pip" install --quiet Pillow
          "$RUNNER_TEMP/pillow-venv/bin/python" tools/generate_bootanimation.py \
            theme/assets/lucid-wallpaper-dusk.jpg out/LucidOS-bootanimation.zip
          unzip -t out/LucidOS-bootanimation.zip | tail -n 2
          ls -lh out/LucidOS-bootanimation.zip
          sha256sum out/LucidOS-bootanimation.zip > report/bootanimation-sha256.txt

      - name: Upload overlay and validation report
        uses: actions/upload-artifact@v4
        with:
          name: lucid-theme-overlay-prototype
          path: |
            out/LucidOS-Framework-Theme-Overlay.apk
            out/LucidWallpapers.apk
            out/LucidOS-bootanimation.zip
            report/
          if-no-files-found: error
          retention-days: 7
