name: Rebuild Full LucidOS Product Partition

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  rebuild-product:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install filesystem and compression tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq e2fsprogs brotli zstd zip unzip attr

      - name: Download source product tree, ROM archive, and theme artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/rom" "$RUNNER_TEMP/theme" report out
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python3 - "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/release-ids.json" <<'PY'
          import json, sys
          releases=json.load(open(sys.argv[1]))
          release=next((r for r in releases if r.get("tag_name")=="tobelucid-source-v1"),None)
          if not release:
              raise SystemExit("Draft release tag tobelucid-source-v1 was not found.")
          assets={a["name"]:a["id"] for a in release.get("assets",[])}
          required=("LucidOS-unsigned.zip","product-mod-tree.tar.zst")
          missing=[name for name in required if name not in assets]
          if missing:
              raise SystemExit("Missing release asset(s): "+", ".join(missing)+". Upload product-mod-tree.tar.zst, then rerun this workflow.")
          json.dump({"release_id":release["id"],"rom_asset_id":assets["LucidOS-unsigned.zip"],
                     "tree_asset_id":assets["product-mod-tree.tar.zst"],
                     "fixed_asset_id":assets.get("LucidOS-unsigned-full-product.zip")},open(sys.argv[2],"w"))
          PY
          ROM_ID="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP/release-ids.json"'"))["rom_asset_id"])')"
          TREE_ID="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP/release-ids.json"'"))["tree_asset_id"])')"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ROM_ID" \
            --output "$RUNNER_TEMP/rom/LucidOS-unsigned.zip"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$TREE_ID" \
            --output "$RUNNER_TEMP/source/product-mod-tree.tar.zst"
          zstd -t "$RUNNER_TEMP/source/product-mod-tree.tar.zst"
          zstd -dc "$RUNNER_TEMP/source/product-mod-tree.tar.zst" | tar -xf - -C "$RUNNER_TEMP/source"
          TREE="$(find "$RUNNER_TEMP/source" -maxdepth 5 -type d -name product_mod -print -quit)"
          if [[ -z "$TREE" ]]; then
            if [[ -d "$RUNNER_TEMP/source/app" && -d "$RUNNER_TEMP/source/etc" ]]; then
              TREE="$RUNNER_TEMP/source"
            else
              echo "The archive must contain a complete product_mod/ filesystem tree." >&2
              exit 1
            fi
          fi
          echo "$TREE" > "$RUNNER_TEMP/product-tree-path.txt"
          FILE_COUNT="$(find "$TREE" -type f | wc -l)"
          TREE_BYTES="$(du -sb "$TREE" | awk '{print $1}')"
          {
            echo "source_tree=$TREE"
            echo "file_count=$FILE_COUNT"
            echo "tree_bytes=$TREE_BYTES"
            echo "=== top-level ==="
            ls -lah "$TREE"
          } > report/source-tree-inventory.txt
          if (( FILE_COUNT < 100 || TREE_BYTES < 300000000 )); then
            echo "Refusing to build from a suspiciously small product tree ($FILE_COUNT files, $TREE_BYTES bytes)." >&2
            exit 1
          fi
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lucid-theme-overlay.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id')"
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name lucid-theme-overlay-prototype --dir "$RUNNER_TEMP/theme"
          test -s "$RUNNER_TEMP/theme/out/LucidOS-Framework-Theme-Overlay.apk"
          test -s "$RUNNER_TEMP/theme/out/LucidWallpapers.apk"
          test -s "$RUNNER_TEMP/theme/out/LucidOS-bootanimation.zip"
          echo "theme_source_run=$RUN_ID" >> report/source-tree-inventory.txt

      - name: Fetch AOSP host filesystem tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aosp-tools"
          curl --fail --location --retry 3 --retry-all-errors \
            "https://android.googlesource.com/kernel/prebuilts/build-tools/+archive/0a1270d749f286c168ac6bb120997471f029130a/linux-x86.tar.gz" \
            --output "$RUNNER_TEMP/aosp-tools.tar.gz"
          tar -xzf "$RUNNER_TEMP/aosp-tools.tar.gz" -C "$RUNNER_TEMP/aosp-tools"
          E2FSDROID="$(find "$RUNNER_TEMP/aosp-tools" -type f -name e2fsdroid -print -quit)"
          test -n "$E2FSDROID"
          chmod +x "$E2FSDROID"
          TOOLS_ROOT="$(dirname "$(dirname "$E2FSDROID")")"
          echo "E2FSDROID=$E2FSDROID" >> "$GITHUB_ENV"
          echo "AOSP_TOOLS_ROOT=$TOOLS_ROOT" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$TOOLS_ROOT/lib64:$TOOLS_ROOT/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          "$E2FSDROID" -h > report/e2fsdroid-help.txt 2>&1 || true
          ldd "$E2FSDROID" > report/e2fsdroid-linked-libraries.txt 2>&1 || true

      - name: Build a complete themed product filesystem
        shell: bash
        run: |
          set -euo pipefail
          TREE="$(cat "$RUNNER_TEMP/product-tree-path.txt")"
          IMAGE="$RUNNER_TEMP/product-full.img"
          BLOCK_SIZE=4096
          PARTITION_SIZE=2504368128
          BLOCKS=$((PARTITION_SIZE / BLOCK_SIZE))
          FILE_CONTEXTS="$RUNNER_TEMP/product-file-contexts"
          cp system-tree/system/etc/selinux/plat_file_contexts "$FILE_CONTEXTS"

          mkdir -p "$TREE/overlay" "$TREE/app/LucidWallpapers" "$TREE/media" "$TREE/etc"
          cp "$RUNNER_TEMP/theme/out/LucidOS-Framework-Theme-Overlay.apk" \
            "$TREE/overlay/LucidOSFrameworkThemeOverlay.apk"
          cp "$RUNNER_TEMP/theme/out/LucidWallpapers.apk" \
            "$TREE/app/LucidWallpapers/LucidWallpapers.apk"
          cp "$RUNNER_TEMP/theme/out/LucidOS-bootanimation.zip" \
            "$TREE/media/bootanimation.zip"
          printf 'status=clean\nsource=cloud-rebuilt\n' > "$TREE/etc/lucid-base-product-verified"
          chmod 0644 "$TREE/overlay/LucidOSFrameworkThemeOverlay.apk" \
            "$TREE/app/LucidWallpapers/LucidWallpapers.apk" \
            "$TREE/media/bootanimation.zip" "$TREE/etc/lucid-base-product-verified"
          chmod 0755 "$TREE/overlay" "$TREE/app" "$TREE/app/LucidWallpapers" "$TREE/media" "$TREE/etc"
          sudo chown -hR 0:0 "$TREE"

          truncate -s "$PARTITION_SIZE" "$IMAGE"
          mke2fs -F -t ext4 -b "$BLOCK_SIZE" -L product -m 0 "$IMAGE" "$BLOCKS" \
            > report/mke2fs-product.txt 2>&1
          "$E2FSDROID" -f "$TREE" -a /product -T 1766435978 -S "$FILE_CONTEXTS" "$IMAGE" \
            > report/e2fsdroid-product.txt 2>&1
          e2fsck -fy "$IMAGE" > report/product-e2fsck-repair.txt 2>&1 || true
          set +e
          e2fsck -fn "$IMAGE" > report/product-e2fsck-final.txt 2>&1
          FSCK_STATUS=$?
          set -e
          if [[ "$FSCK_STATUS" -ne 0 ]]; then
            cat report/product-e2fsck-final.txt
            echo "Rebuilt product filesystem did not pass e2fsck; refusing to package." >&2
            exit 1
          fi
          dumpe2fs -h "$IMAGE" > report/product-superblock.txt 2>&1
          sha256sum "$IMAGE" > report/product-image-sha256.txt
          ls -lh "$IMAGE" > report/product-image-size.txt

      - name: Replace incremental product payload with full image payload
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/product-full.img"
          UPDATE="$RUNNER_TEMP/update"
          mkdir -p "$UPDATE"
          BLOCKS=$((2504368128 / 4096))
          printf '4\n%s\n0\n0\nnew 2,0,%s\n' "$BLOCKS" "$BLOCKS" > "$UPDATE/product.transfer.list"
          brotli -q 6 -c "$IMAGE" > "$UPDATE/product.new.dat.br"
          ls -lh "$UPDATE/product.new.dat.br" > report/full-product-payload-size.txt
          cp "$RUNNER_TEMP/rom/LucidOS-unsigned.zip" out/LucidOS-unsigned-full-product.zip
          (cd "$UPDATE" && zip -0 -u "$GITHUB_WORKSPACE/out/LucidOS-unsigned-full-product.zip" product.transfer.list product.new.dat.br)
          unzip -t out/LucidOS-unsigned-full-product.zip | tail -n 2
          unzip -p out/LucidOS-unsigned-full-product.zip product.transfer.list > report/final-product-transfer-list.txt
          sha256sum out/LucidOS-unsigned-full-product.zip > report/fixed-rom-sha256.txt
          SIZE="$(stat -c%s out/LucidOS-unsigned-full-product.zip)"
          if (( SIZE > 1900000000 )); then
            echo "Fixed ROM exceeds the conservative GitHub release asset size limit: $SIZE bytes." >&2
            exit 1
          fi

      - name: Upload fixed ROM as draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/release-ids.json" <<'PY'
          import json, sys
          data=json.load(open(sys.argv[1]))
          meta=json.load(open(sys.argv[2]))
          release=next(r for r in data if r["id"]==meta["release_id"])
          print(release["id"])
          PY
          RELEASE_ID="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP/release-ids.json"'"))["release_id"])')"
          OLD_ID="$(python3 -c 'import json;print(json.load(open("'"$RUNNER_TEMP/release-ids.json"'")).get("fixed_asset_id") or "")')"
          if [[ -n "$OLD_ID" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$OLD_ID"
          fi
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @out/LucidOS-unsigned-full-product.zip \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=LucidOS-unsigned-full-product.zip"
          echo "Uploaded LucidOS-unsigned-full-product.zip to draft release $RELEASE_ID."

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-product-rebuild-report
          path: report/
          if-no-files-found: warn
          retention-days: 7
