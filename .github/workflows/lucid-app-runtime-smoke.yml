name: Lucid app runtime crash sweep

on:
  workflow_dispatch:
  push:
    branches: [feature/lucid-control-centre-connect]
    paths:
      - 'theme/lucid-control-centre/**'
      - 'theme/lucid-settings/**'
      - 'theme/lucid-wallpaper/**'
      - 'theme/lucid-updater/**'
      - 'theme/lucid-launcher/**'
      - 'theme/lucid-desktop/**'
      - 'theme/dynamic-island/**'
      - 'tools/build_lucid_apps.sh'
      - '.github/workflows/lucid-app-runtime-smoke.yml'

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build every Lucid app from current source
        shell: bash
        run: |
          set -euo pipefail
          bash tools/build_lucid_apps.sh "$RUNNER_TEMP/lucid-apps"
          gradle -p theme/dynamic-island assembleDebug
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/lucid-apps/lucid-build.keystore" \
            --ks-pass pass:lucidbuild --key-pass pass:lucidbuild \
            --out "$RUNNER_TEMP/lucid-apps/Lucid-Dynamic-Island.apk" \
            theme/dynamic-island/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$RUNNER_TEMP/lucid-apps/Lucid-Dynamic-Island.apk"
          mkdir -p "$RUNNER_TEMP/runtime-logs/screenshots"
      - name: Boot Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 1024M
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash tools/lucid_app_runtime_smoke.sh
      - name: Upload per-app runtime logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-app-runtime-logs-and-screenshots
          path: ${{ runner.temp }}/runtime-logs/
          if-no-files-found: warn
          retention-days: 30
