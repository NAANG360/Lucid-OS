name: Validate Lucid Native Apps
on:
  push:
    branches: [feature/lucid-control-centre-connect]
    paths:
      - 'theme/lucid-control-centre/**'
      - 'theme/lucid-settings/**'
      - 'theme/lucid-wallpaper/**'
      - 'theme/lucid-updater/**'
      - 'theme/lucid-launcher/**'
      - 'theme/lucid-desktop/**'
      - '.github/workflows/validate-lucid-apps.yml'
      - '.github/workflows/build-lucid-control-centre.yml'
      - '.github/workflows/build-lucid-desktop.yml'
      - '.github/workflows/build-lucid-launcher.yml'
      - '.github/workflows/build-lucid-settings.yml'
      - '.github/workflows/build-lucid-updater.yml'
      - '.github/workflows/build-lucid-wallpaper.yml'
  pull_request:
    paths:
      - 'theme/lucid-control-centre/**'
      - 'theme/lucid-settings/**'
      - 'theme/lucid-wallpaper/**'
      - 'theme/lucid-updater/**'
      - 'theme/lucid-launcher/**'
      - 'theme/lucid-desktop/**'
      - '.github/workflows/validate-lucid-apps.yml'
      - '.github/workflows/build-lucid-control-centre.yml'
      - '.github/workflows/build-lucid-desktop.yml'
      - '.github/workflows/build-lucid-launcher.yml'
      - '.github/workflows/build-lucid-settings.yml'
      - '.github/workflows/build-lucid-updater.yml'
      - '.github/workflows/build-lucid-wallpaper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        app:
          - lucid-control-centre
          - lucid-settings
          - lucid-wallpaper
          - lucid-updater
          - lucid-launcher
          - lucid-desktop
    name: Compile ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          dirname "$SDKMANAGER" >> "$GITHUB_PATH"
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Compile, package and verify APK
        shell: bash
        run: |
          set -euo pipefail
          APP="$GITHUB_WORKSPACE/theme/${{ matrix.app }}"
          OUT="$RUNNER_TEMP/${{ matrix.app }}"
          test -f "$APP/AndroidManifest.xml"
          mapfile -t SOURCES < <(find "$APP/src" -type f -name '*.java' -print | sort)
          test "${#SOURCES[@]}" -gt 0
          mkdir -p "$OUT/classes" "$OUT/dex"
          javac -source 8 -target 8 -classpath "$ANDROID_HOME/platforms/android-35/android.jar" -d "$OUT/classes" "${SOURCES[@]}"
          mapfile -t CLASS_FILES < <(find "$OUT/classes" -type f -name '*.class' -print | sort)
          test "${#CLASS_FILES[@]}" -gt 0
          "$ANDROID_HOME/build-tools/35.0.0/d8" --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output "$OUT/dex" "${CLASS_FILES[@]}"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" package -f -M "$APP/AndroidManifest.xml" -I "$ANDROID_HOME/platforms/android-35/android.jar" -F "$OUT/app-unsigned.apk"
          (cd "$OUT/dex" && zip -q "$OUT/app-unsigned.apk" classes.dex)
          keytool -genkeypair -keystore "$OUT/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Lucid OS CI,O=Lucid,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$OUT/debug.keystore" --ks-pass pass:android --key-pass pass:android --out "$OUT/${{ matrix.app }}.apk" "$OUT/app-unsigned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$OUT/${{ matrix.app }}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$OUT/${{ matrix.app }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ${{ runner.temp }}/${{ matrix.app }}/${{ matrix.app }}.apk
          if-no-files-found: error
          retention-days: 14