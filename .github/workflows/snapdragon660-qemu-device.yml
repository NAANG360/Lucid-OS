name: Build Snapdragon UARTDM QEMU Device
on:
  push:
    paths:
      - 'emulator/snapdragon660/qemu/**'
      - '.github/workflows/snapdragon660-qemu-device.yml'
  pull_request:
    paths:
      - 'emulator/snapdragon660/qemu/**'
      - '.github/workflows/snapdragon660-qemu-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-qemu-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-venv python3-pip ninja-build meson \
            build-essential pkg-config libglib2.0-dev libpixman-1-dev \
            libfdt-dev zlib1g-dev
      - name: Fetch pinned QEMU source
        run: |
          git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu-src
          cp emulator/snapdragon660/qemu/hw/char/sdm660_uartdm.c qemu-src/hw/char/
          printf "\\nsystem_ss.add(files('sdm660_uartdm.c'))\\n" >> qemu-src/hw/char/meson.build
          # Add the custom concrete device to virt's dynamic SysBus allowlist.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("qemu-src/hw/arm/virt.c")
          s = p.read_text()
          needle = "    machine_class_allow_dynamic_sysbus_dev(mc, TYPE_VFIO_CALXEDA_XGMAC);"
          added = '    machine_class_allow_dynamic_sysbus_dev(mc, "sdm660-uartdm");'
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate virt SysBus allowlist")
          s = s.replace(needle, needle + "\\n" + added)
          if added not in s:
              raise SystemExit("UARTDM allowlist insertion failed")
          p.write_text(s)
          PY
      - name: Verify UARTDM offsets against pinned lavender kernel source
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/xiaomi-sdm660/android_kernel_xiaomi_sdm660/5ce3bc43631dca83f6081757c8982c2d5f6e017c/drivers/tty/serial/msm_serial_hs_hwreg.h \
            -o /tmp/msm_serial_hs_hwreg.h
          python3 emulator/snapdragon660/tools/validate_uartdm_register_map.py \
            --kernel-header /tmp/msm_serial_hs_hwreg.h \
            --qemu-source emulator/snapdragon660/qemu/hw/char/sdm660_uartdm.c
      - name: Restore QEMU build cache
        uses: actions/cache/restore@v4
        with:
          path: qemu-src/build
          key: qemu-v10.0.0-aarch64-softmmu-build-v1
      - name: Configure and compile AArch64 system emulator
        working-directory: qemu-src
        run: |
          ./configure --target-list=aarch64-softmmu --disable-werror --disable-docs
          ninja -C build qemu-system-aarch64

      - name: Save compiled QEMU build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: qemu-src/build
          key: qemu-v10.0.0-aarch64-softmmu-build-v1
      - name: Runtime smoke test device registration and realization
        working-directory: qemu-src
        run: |
          set -eux
          ./build/qemu-system-aarch64 \
            -machine virt -accel tcg -nodefaults -display none \
            -monitor none -serial none -S \
            -chardev file,id=uart,path=/tmp/sdm660-uartdm-smoke.log \
            -device sdm660-uartdm,chardev=uart \
            -daemonize -pidfile /tmp/sdm660-qemu.pid
          kill -0 "$(cat /tmp/sdm660-qemu.pid)"
          kill "$(cat /tmp/sdm660-qemu.pid)"
