name: Build Snapdragon UARTDM QEMU Device
on:
  push:
    paths:
      - 'emulator/snapdragon660/qemu/**'
      - 'emulator/snapdragon660/tools/**'
      - 'emulator/snapdragon660/tests/**'
      - '.github/workflows/snapdragon660-qemu-device.yml'
  pull_request:
    paths:
      - 'emulator/snapdragon660/qemu/**'
      - 'emulator/snapdragon660/tools/**'
      - 'emulator/snapdragon660/tests/**'
      - '.github/workflows/snapdragon660-qemu-device.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-qemu-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check native machine validators and tests
        run: |
          python3 -m py_compile \
            emulator/snapdragon660/tools/validate_uartdm_register_map.py \
            emulator/snapdragon660/tools/validate_native_machine_contract.py \
            emulator/snapdragon660/tests/test_uartdm_register_map.py \
            emulator/snapdragon660/tests/test_variant.py \
            emulator/snapdragon660/qemu/tests/smoke_uartdm.py
      - name: Run Snapdragon model regression tests
        run: python3 -m unittest discover -s emulator/snapdragon660/tests -v
      - name: Install QEMU build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git python3 python3-venv python3-pip ninja-build meson \
            build-essential pkg-config libglib2.0-dev libpixman-1-dev \
            libfdt-dev zlib1g-dev binutils-aarch64-linux-gnu
      - name: Restore QEMU source and build cache
        id: qemu-cache
        uses: actions/cache/restore@v4
        with:
          path: qemu-src
          key: qemu-v10.0.0-aarch64-softmmu-source-build-sdm660-v2
      - name: Fetch pinned QEMU source and register SDM660 board plus UARTDM
        run: |
          if [ ! -d qemu-src/.git ]; then
            git clone --depth 1 --branch v10.0.0 https://github.com/qemu/qemu.git qemu-src
          fi
          cp emulator/snapdragon660/qemu/hw/char/sdm660_uartdm.c qemu-src/hw/char/
          cp emulator/snapdragon660/qemu/hw/arm/sdm660_lavender.c qemu-src/hw/arm/
          python3 - <<'PY'
          from pathlib import Path
          meson = Path("qemu-src/hw/arm/meson.build")
          line = "arm_ss.add(when: 'CONFIG_SDM660_LAVENDER', if_true: files('sdm660_lavender.c'))"
          s = meson.read_text()
          if line not in s:
              meson.write_text(s.rstrip() + "\n" + line + "\n")
          kconfig = Path("qemu-src/hw/arm/Kconfig")
          s = kconfig.read_text()
          block = """config SDM660_LAVENDER
              bool
              default y
              depends on TCG && AARCH64
              select ARM_GIC
              select DEVICE_TREE
          """
          if "config SDM660_LAVENDER" not in s:
              marker = "config SBSA_REF\n"
              if s.count(marker) != 1:
                  raise SystemExit("Could not uniquely locate ARM board Kconfig insertion point")
              s = s.replace(marker, block + "\n" + marker)
              kconfig.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          meson = Path("qemu-src/hw/char/meson.build")
          source_line = "system_ss.add(files('sdm660_uartdm.c'))"
          contents = meson.read_text()
          if source_line not in contents:
              meson.write_text(contents.rstrip() + "\n" + source_line + "\n")
          PY
          # Allow only this concrete UARTDM device as a dynamic SysBus device.
          # QEMU's virt machine emits FDT nodes for dynamic SysBus devices; add a
          # no-op FDT binding too, otherwise startup aborts in sysbus-fdt.c.
          python3 - <<'PY'
          from pathlib import Path
          virt = Path("qemu-src/hw/arm/virt.c")
          s = virt.read_text()
          needle = "    machine_class_allow_dynamic_sysbus_dev(mc, TYPE_VFIO_CALXEDA_XGMAC);"
          added = '    machine_class_allow_dynamic_sysbus_dev(mc, "sdm660-uartdm");'
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate virt SysBus allowlist")
          if added not in s:
              s = s.replace(needle, needle + chr(10) + added)
              virt.write_text(s)
          if added not in virt.read_text():
              raise SystemExit("UARTDM SysBus allowlist insertion failed")

          fdt = Path("qemu-src/hw/core/sysbus-fdt.c")
          s = fdt.read_text()
          needle = '    TYPE_BINDING(TYPE_RAMFB_DEVICE, no_fdt_node),'
          added = '    TYPE_BINDING("sdm660-uartdm", no_fdt_node),'
          if s.count(needle) != 1:
              raise SystemExit("Could not uniquely locate dynamic SysBus FDT bindings")
          if added not in s:
              s = s.replace(needle, added + chr(10) + needle)
              fdt.write_text(s)
          if added not in fdt.read_text():
              raise SystemExit("UARTDM no-op FDT binding insertion failed")
          PY
      - name: Verify UARTDM offsets against pinned lavender kernel source
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/xiaomi-sdm660/android_kernel_xiaomi_sdm660/5ce3bc43631dca83f6081757c8982c2d5f6e017c/drivers/tty/serial/msm_serial_hs_hwreg.h \
            -o /tmp/msm_serial_hs_hwreg.h
          curl -fsSL \
            https://raw.githubusercontent.com/xiaomi-sdm660/android_kernel_xiaomi_sdm660/5ce3bc43631dca83f6081757c8982c2d5f6e017c/drivers/tty/serial/msm_serial_hs.c \
            -o /tmp/msm_serial_hs.c
          curl -fsSL \
            https://raw.githubusercontent.com/xiaomi-sdm660/android_kernel_xiaomi_sdm660/5ce3bc43631dca83f6081757c8982c2d5f6e017c/arch/arm/boot/dts/qcom/sdm660.dtsi \
            -o /tmp/sdm660.dtsi
          python3 emulator/snapdragon660/tools/validate_uartdm_register_map.py \
            --kernel-header /tmp/msm_serial_hs_hwreg.h \
            --kernel-driver /tmp/msm_serial_hs.c \
            --kernel-dtsi /tmp/sdm660.dtsi \
            --qemu-source emulator/snapdragon660/qemu/hw/char/sdm660_uartdm.c
      - name: Validate native machine UART mapping against SoC DTSI
        run: |
          python3 emulator/snapdragon660/tools/validate_native_machine_contract.py \
            --kernel-dtsi /tmp/sdm660.dtsi \
            --machine-source emulator/snapdragon660/qemu/hw/arm/sdm660_lavender.c
      - name: Validate source-derived SDM660 memory map
        run: python3 emulator/snapdragon660/tools/validate_board_memory_map.py
      - name: Configure AArch64 system emulator after applying board patches
        working-directory: qemu-src
        run: |
          # Reconfigure even on a cache hit: board Kconfig/Meson edits are
          # applied after cache restore and must reach generated build metadata.
          ./configure --target-list=aarch64-softmmu --disable-werror --disable-docs
      - name: Compile AArch64 system emulator
        working-directory: qemu-src
        run: |
          ninja -C build qemu-system-aarch64

      - name: Save QEMU source and build cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: qemu-src
          key: qemu-v10.0.0-aarch64-softmmu-source-build-sdm660-v2
      - name: Build bare-metal AArch64 machine smoke image
        run: |
          cat > /tmp/sdm660-smoke.S <<'ASM'
          .section .text
          .global _start
          _start:
          1:  wfe
              b 1b
          ASM
          cat > /tmp/sdm660-smoke.ld <<'LD'
          ENTRY(_start)
          SECTIONS { . = 0x80000000; .text : { *(.text*) } }
          LD
          aarch64-linux-gnu-as -o /tmp/sdm660-smoke.o /tmp/sdm660-smoke.S
          aarch64-linux-gnu-ld -T /tmp/sdm660-smoke.ld -o /tmp/sdm660-smoke.elf /tmp/sdm660-smoke.o
          cat > /tmp/sdm660-psci-smoke.S <<'ASM'
          .section .text
          .global _start
          _start:
              movz x6, #0x2000
              movk x6, #0x8000, lsl #16
              str wzr, [x6]
              dsb sy
              /* PSCI 0.2 CPU_ON 64-bit, target CPU affinity 0x001. */
              movz x0, #3
              movk x0, #0xc400, lsl #16
              mov x1, #1
              adr x2, secondary_entry
              mov x3, #0
              smc #0
              cbnz x0, fail
              /* Treat all caller-saved registers as clobbered by SMC. */
              movz x6, #0x2000
              movk x6, #0x8000, lsl #16
              movz x4, #0x4240
              movk x4, #0xf, lsl #16
          1:  ldr w5, [x6]
              cmp w5, #0x660
              b.eq success
              subs x4, x4, #1
              b.ne 1b
              b fail
          secondary_entry:
              movz x6, #0x2000
              movk x6, #0x8000, lsl #16
              mov w5, #0x660
              str w5, [x6]
              dsb sy
          2:  wfe
              b 2b
          success:
              movz x6, #0x3000
              movk x6, #0x8000, lsl #16
              movz x5, #0x0026
              movk x5, #0x2, lsl #16
              str x5, [x6]
              str xzr, [x6, #8]
              mov x0, #0x20
              mov x1, x6
              hlt #0xf000
              b .
          fail:
              movz x6, #0x3000
              movk x6, #0x8000, lsl #16
              movz x5, #0x0026
              movk x5, #0x2, lsl #16
              str x5, [x6]
              mov x5, #1
              str x5, [x6, #8]
              mov x0, #0x20
              mov x1, x6
              hlt #0xf000
              b .
          ASM
          cat > /tmp/sdm660-psci-smoke.ld <<'LD'
          ENTRY(_start)
          SECTIONS { . = 0x80000000; .text : { *(.text*) } }
          LD
          aarch64-linux-gnu-as -o /tmp/sdm660-psci-smoke.o /tmp/sdm660-psci-smoke.S
          aarch64-linux-gnu-ld -T /tmp/sdm660-psci-smoke.ld -o /tmp/sdm660-psci-smoke.elf /tmp/sdm660-psci-smoke.o
      - name: Verify and execute native Snapdragon machine
        working-directory: qemu-src
        run: |
          set -eux
          ./build/qemu-system-aarch64 -machine help | grep -F 'sdm660-lavender'
          ./build/qemu-system-aarch64 -machine sdm660-lavender,help
          set +e
          timeout 5s ./build/qemu-system-aarch64 \
            -machine sdm660-lavender -m 4G -smp 1 \
            -kernel /tmp/sdm660-smoke.elf -display none -serial null \
            -monitor none -nodefaults
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Native SDM660 single-core smoke guest exited (status=$status)"
            exit 1
          fi
          # Exercise the asymmetric MPIDR map and eight-CPU GIC redistributor
          # geometry as well; a one-core boot cannot validate those paths.
          set +e
          timeout 5s ./build/qemu-system-aarch64 \
            -machine sdm660-lavender -m 4G -smp 8 \
            -kernel /tmp/sdm660-smoke.elf -display none -serial null \
            -monitor none -nodefaults
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "Native SDM660 eight-core smoke guest exited (status=$status)"
            exit 1
          fi
          echo "Native SDM660 machine executed the AArch64 smoke image with 1 and 8 CPUs"
      - name: Verify PSCI CPU_ON starts a secondary SDM660 CPU
        working-directory: qemu-src
        run: |
          set -eux
          timeout 10s ./build/qemu-system-aarch64 \
            -machine sdm660-lavender -m 4G -smp 8 \
            -kernel /tmp/sdm660-psci-smoke.elf \
            -display none -serial null -monitor none -nodefaults \
            -semihosting-config enable=on,target=native
          echo "PASS: PSCI CPU_ON started CPU affinity 0x001"
      - name: Runtime test UARTDM MMIO and TX path
        run: |
          set -eux
          python3 emulator/snapdragon660/qemu/tests/smoke_uartdm.py
