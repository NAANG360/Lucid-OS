name: Validate GitHub Workflows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/**

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --location --retry 3 \
            https://api.github.com/repos/rhysd/actionlint/releases/latest \
            --output "$RUNNER_TEMP/actionlint-release.json"
          URL="$(python3 - "$RUNNER_TEMP/actionlint-release.json" <<'PY'
          import json, sys
          release=json.load(open(sys.argv[1]))
          asset=next((a for a in release.get("assets",[]) if a.get("name","").endswith("linux_amd64.tar.gz")),None)
          if not asset:
              raise SystemExit("Could not find actionlint linux_amd64 release asset.")
          print(asset["browser_download_url"])
          PY
          )"
          curl --fail --location --retry 3 "$URL" --output "$RUNNER_TEMP/actionlint.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint"
          chmod +x "$RUNNER_TEMP/actionlint/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Lint all GitHub Actions workflows
        run: "$RUNNER_TEMP/actionlint/actionlint" -color
