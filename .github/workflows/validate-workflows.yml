name: Validate GitHub Workflows

on:
  workflow_dispatch:
  push:
    branches: [main, feature/lucid-control-centre-connect]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install actionlint from source
        run: |
          set -euo pipefail
          GOBIN="$RUNNER_TEMP/actionlint" go install github.com/rhysd/actionlint/cmd/actionlint@latest
          "$RUNNER_TEMP/actionlint/actionlint" -version

      - name: Lint all GitHub Actions workflows
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color -ignore 'SC2046|SC2005'
