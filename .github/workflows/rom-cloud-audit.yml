name: ROM Cloud Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rom-cloud-audit.yml

permissions:
  contents: write

jobs:
  inspect-rom:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Prepare runner and discover draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v unzip
          mkdir -p audit "$RUNNER_TEMP/rom"
          {
            echo "UTC: $(date -u)"
            echo
            echo "=== Runner disk before download ==="
            df -h
          } > audit/runner-and-release.txt

          # Draft releases cannot reliably be resolved by tag through gh release view.
          # Find the asset through the authenticated Releases API instead.
          RELEASE_JSON="$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RELEASE_JSON"
          ASSET_ID="$(python3 - "$RELEASE_JSON" <<'PY'
          import json, sys
          releases=json.load(open(sys.argv[1]))
          for release in releases:
              if release.get("tag_name") == "tobelucid-source-v1":
                  for asset in release.get("assets", []):
                      if asset.get("name") == "LucidOS-unsigned.zip":
                          print(asset["id"])
                          raise SystemExit(0)
          raise SystemExit("Could not find LucidOS-unsigned.zip in release tag tobelucid-source-v1")
          PY
          )"
          echo "$ASSET_ID" > "$RUNNER_TEMP/asset-id.txt"
          python3 - "$RELEASE_JSON" >> audit/runner-and-release.txt <<'PY'
          import json, sys
          for release in json.load(open(sys.argv[1])):
              if release.get("tag_name") == "tobelucid-source-v1":
                  print("=== Release metadata ===")
                  print("name:", release.get("name"))
                  print("tag:", release.get("tag_name"))
                  print("draft:", release.get("draft"))
                  for asset in release.get("assets", []):
                      print("asset:", asset.get("name"), "size:", asset.get("size"), "state:", asset.get("state"), "id:", asset.get("id"))
          PY

      - name: Download the draft release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET_ID="$(cat "$RUNNER_TEMP/asset-id.txt")"
          ZIP="$RUNNER_TEMP/rom/LucidOS-unsigned.zip"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --output "$ZIP"
          test -s "$ZIP"
          {
            echo
            echo "=== Downloaded archive ==="
            ls -lh "$ZIP"
            sha256sum "$ZIP"
            echo
            echo "=== Runner disk after download ==="
            df -h
          } >> audit/runner-and-release.txt

      - name: Inventory ZIP and extract small boot-critical text files
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/rom/LucidOS-unsigned.zip"
          python3 - "$ZIP" audit <<'PY'
          import json, os, re, sys, zipfile
          archive, outdir = sys.argv[1], sys.argv[2]
          os.makedirs(outdir, exist_ok=True)
          critical = re.compile(r'(^|/)(META-INF/.*(updater-script|update-binary)|[^/]*(fstab|dynamic_partitions|super_empty|payload\.bin|boot\.img|vendor_boot\.img|init_boot\.img|dtbo\.img|vbmeta[^/]*\.img|recovery\.img|cust[^/]*\.img|vendor[^/]*\.img|system[^/]*\.img|product[^/]*\.img|system_ext[^/]*\.img|odm[^/]*\.img|[^/]*\.rc|[^/]*\.prop|[^/]*\.sh)$)', re.I)
          text_candidate = re.compile(r'(^|/)(updater-script|[^/]*fstab[^/]*|[^/]*dynamic[^/]*partition[^/]*|[^/]*(install|flash|assert|partition)[^/]*\.sh|[^/]*\.prop|[^/]*\.rc|[^/]*\.xml)$', re.I)
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              with open(os.path.join(outdir, "archive-file-list.txt"), "w") as f:
                  for i in infos: f.write(i.filename + "\n")
              with open(os.path.join(outdir, "critical-file-index.txt"), "w") as f:
                  f.write("Archive entries: %d\n\n" % len(infos))
                  f.write("Boot, partition, installer and filesystem candidates:\n")
                  for i in infos:
                      if critical.search(i.filename):
                          f.write("%10d  %s\n" % (i.file_size, i.filename))
              with open(os.path.join(outdir, "selected-text-files.txt"), "w") as f:
                  for i in infos:
                      if i.is_dir() or i.file_size > 200_000 or not text_candidate.search(i.filename):
                          continue
                      f.write("\n===== %s (%d bytes) =====\n" % (i.filename, i.file_size))
                      try:
                          data = z.read(i).decode("utf-8", "replace")
                          f.write(data[:200_000] + "\n")
                      except Exception as e:
                          f.write("[read failed: %s]\n" % e)
          print("Indexed %d ZIP entries" % len(infos))
          PY
          python3 - "$ZIP" audit <<'PY'
          import hashlib, os, struct, sys, zipfile
          zp, outdir = sys.argv[1], sys.argv[2]
          selected = {
              "boot.img", "dtbo.img", "vbmeta.img", "super_dummy.img",
              "unsparse_super_empty.img", "system.transfer.list", "vendor.transfer.list",
              "product.transfer.list", "odm.transfer.list", "system_ext.transfer.list",
              "system.patch.dat", "vendor.patch.dat", "product.patch.dat",
              "odm.patch.dat", "system_ext.patch.dat", "META-INF/com/android/metadata",
              "META-INF/com/android/metadata.pb", "META-INF/com/google/android/updater-script",
              "dynamic_partitions_op_list"
          }
          def boot_report(data):
              out=[]
              if data[:8] != b"ANDROID!":
                  return ["FAIL: no ANDROID! boot magic; first 64 bytes: "+data[:64].hex()]
              out.append("magic: ANDROID!")
              if len(data) < 48:
                  return out + ["FAIL: truncated boot header"]
              words = struct.unpack_from("<10I", data, 8)
              kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version, os_version = words
              out += [
                  f"legacy_kernel_size: {kernel_size}",
                  f"legacy_kernel_addr: 0x{kernel_addr:08x}",
                  f"legacy_ramdisk_size: {ramdisk_size}",
                  f"legacy_ramdisk_addr: 0x{ramdisk_addr:08x}",
                  f"legacy_second_size: {second_size}",
                  f"legacy_second_addr: 0x{second_addr:08x}",
                  f"legacy_tags_addr: 0x{tags_addr:08x}",
                  f"legacy_page_size: {page_size}",
                  f"header_version_at_offset_40: {header_version} (0x{header_version:08x})",
                  f"os_version_at_offset_44: 0x{os_version:08x}",
              ]
              if header_version in (0,1,2):
                  out.append("header_layout: legacy v0-v2")
                  out.append("legacy_page_size_valid: "+str(page_size in (2048,4096,16384)))
                  if page_size not in (2048,4096,16384):
                      out.append("WARNING: page_size is not a valid legacy Android boot image page size")
              elif header_version in (3,4):
                  header_size = struct.unpack_from("<I",data,20)[0]
                  out += [f"header_layout: v{header_version}", f"v3_v4_header_size: {header_size}", "v3_v4_header_size_valid: "+str(header_size in (1580,1584))]
              else:
                  v3_header_size = struct.unpack_from("<I",data,20)[0]
                  out += ["WARNING: header version at offset 40 is outside Android boot header v0-v4", f"v3_v4_interpretation_header_size_at_offset_20: {v3_header_size}"]
              return out
          with zipfile.ZipFile(zp) as z, open(os.path.join(outdir,"binary-image-report.txt"),"w") as f:
              names={i.filename:i for i in z.infolist()}
              f.write("=== Archive entry sizes ===\n")
              for n,i in names.items():
                  f.write(f"{i.file_size:12d} uncompressed  {i.compress_size:12d} compressed  {n}\n")
              f.write("\n=== Selected binary hashes and headers ===\n")
              for n in sorted(selected):
                  if n not in names: continue
                  info=names[n]
                  f.write(f"\n--- {n} ({info.file_size} bytes) ---\n")
                  data=z.read(n)
                  f.write("sha256: "+hashlib.sha256(data).hexdigest()+"\n")
                  f.write("first_64_bytes: "+data[:64].hex()+"\n")
                  if n=="boot.img": f.write("\n".join(boot_report(data))+"\n")
                  if n=="vbmeta.img":
                      f.write("avb0_magic: "+str(data[:4]==b"AVB0")+"\n")
                      if data[:4]==b"AVB0" and len(data)>=256:
                          f.write("required_libavb_version: %d.%d\n"%struct.unpack_from(">II",data,4))
                          f.write("auth_block_size: %d\n"%struct.unpack_from(">Q",data,12)[0])
                          f.write("aux_block_size: %d\n"%struct.unpack_from(">Q",data,20)[0])
                  if n.endswith(".transfer.list"):
                      lines=data.decode("utf-8","replace").splitlines()
                      f.write("transfer_list_header: "+repr(lines[:8])+"\n")
                  if n=="dynamic_partitions_op_list" or n.endswith("updater-script") or n.endswith("/metadata"):
                      f.write(data.decode("utf-8","replace")[:20000]+"\n")
              f.write("\n=== Cust partition references ===\n")
              hits=[n for n in names if "cust" in n.lower()]
              f.write("\n".join(hits) if hits else "No archive entry has 'cust' in its path.")
              f.write("\n")
          PY
          {
            echo "=== ZIP integrity test ==="
            unzip -t "$ZIP" | tail -n 5
            echo
            echo "=== Runner disk after inspection ==="
            df -h
          } > audit/archive-integrity-and-disk.txt

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: lucid-rom-audit
          path: audit/
          if-no-files-found: error
          retention-days: 7
