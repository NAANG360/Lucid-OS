name: Lucid Wallpaper Emulator Smoke Test

concurrency:
  group: lucid-wallpaper-smoke-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Lucid Theme Overlay"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  smoke-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download built wallpaper APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p report/emulator
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            RUN_ID="$SOURCE_RUN_ID"
          else
            RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/lucid-theme-overlay.yml/runs?status=success&per_page=10" --jq '.workflow_runs[0].id')"
          fi
          test -n "$RUN_ID"
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name lucid-theme-overlay-prototype --dir "$GITHUB_WORKSPACE"
          test -s out/LucidWallpapers.apk
          test -s out/LucidControlCenter/LucidControlCenter.apk
          test -s out/LucidSettings/LucidSettings.apk
          echo "source_run=$RUN_ID" > report/emulator/source-run.txt

      - name: Boot Android emulator and smoke-test Lucid Wallpapers
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -writable-system
          pre-emulator-launch-script: python3 tools/configure_android_emulator.py
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            mkdir -p report/emulator
            adb wait-for-device
            adb shell getprop ro.build.version.release | tee report/emulator/android-version.txt
            # The CI emulator uses a normal user install. Privileged palette writes are
            # expected to be restricted here; the ROM rebuild installs this APK as a priv-app.
            adb install -r out/LucidWallpapers.apk
            adb shell am start -W -n com.lucid.os.wallpapers/.MainActivity | tee report/emulator/activity-launch.txt
            sleep 4
            adb shell dumpsys activity activities > report/emulator/activities.txt
            grep -q 'com.lucid.os.wallpapers' report/emulator/activities.txt
            adb shell uiautomator dump /sdcard/lucid-window.xml >/dev/null
            adb pull /sdcard/lucid-window.xml report/emulator/window.xml
            python3 - <<'PY' > "$RUNNER_TEMP/lucid-blue-tap.txt"
            import xml.etree.ElementTree as ET
            root = ET.parse("report/emulator/window.xml").getroot()
            for node in root.iter("node"):
                if node.attrib.get("text") == "Lucid Blue":
                    parts = node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
                    if len(parts) == 4:
                        x1, y1, x2, y2 = map(int, parts)
                        print((x1 + x2) // 2, (y1 + y2) // 2)
                        raise SystemExit(0)
            raise SystemExit("Lucid Blue palette button not found in accessibility tree")
            PY
            read -r TAP_X TAP_Y < "$RUNNER_TEMP/lucid-blue-tap.txt"
            adb shell input tap "$TAP_X" "$TAP_Y"
            sleep 2
            adb shell dumpsys activity activities > report/emulator/activities-after-palette.txt
            grep -q 'com.lucid.os.wallpapers' report/emulator/activities-after-palette.txt
            # Confirm the normal install handles the expected privilege restriction without crashing.
            adb shell settings get secure theme_customization_overlay_packages > report/emulator/palette-setting.txt
            adb shell uiautomator dump /sdcard/lucid-window-after-palette.xml >/dev/null
            adb pull /sdcard/lucid-window-after-palette.xml report/emulator/window-after-palette.xml
            python3 - <<'PY' > "$RUNNER_TEMP/lucid-wallpaper-tap.txt"
            import xml.etree.ElementTree as ET
            root = ET.parse("report/emulator/window-after-palette.xml").getroot()
            for node in root.iter("node"):
                if node.attrib.get("text") == "Set as wallpaper":
                    parts = node.attrib.get("bounds", "").replace("][", ",").strip("[]").split(",")
                    if len(parts) == 4:
                        x1, y1, x2, y2 = map(int, parts)
                        print((x1 + x2) // 2, (y1 + y2) // 2)
                        raise SystemExit(0)
            raise SystemExit("Set as wallpaper button not found in accessibility tree")
            PY
            read -r WALL_X WALL_Y < "$RUNNER_TEMP/lucid-wallpaper-tap.txt"
            adb shell input tap "$WALL_X" "$WALL_Y"
            sleep 3
            adb shell dumpsys wallpaper > report/emulator/wallpaper-service.txt
            grep -Eq 'WallpaperData|mWallpaperId|wallpaperId' report/emulator/wallpaper-service.txt
            adb shell input keyevent HOME
            sleep 2
            adb shell screencap -p /sdcard/lucid-wallpapers.png
            adb pull /sdcard/lucid-wallpapers.png report/emulator/lucid-wallpapers.png
            adb logcat -d -t 4000 > report/emulator/logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: com\.lucid\.os\.wallpapers' report/emulator/logcat.txt; then
              echo "Wallpaper app crashed in emulator." >&2
              exit 1
            fi
            echo "PASS: app installed and launched, palette action did not crash under normal permission limits, wallpaper application was exercised, wallpaper-service state and screenshot captured." | tee report/emulator/result.txt

      - name: Smoke-test Lucid Control Center and Settings dashboard
        shell: bash
        run: |
          set -euo pipefail
          adb install -r out/LucidControlCenter/LucidControlCenter.apk
          adb install -r out/LucidSettings/LucidSettings.apk
          adb shell am start -W -n com.lucid.os.controlcenter/.MainActivity | tee report/emulator/control-center-launch.txt
          sleep 3
          adb shell uiautomator dump /sdcard/lucid-control-center.xml >/dev/null
          adb pull /sdcard/lucid-control-center.xml report/emulator/control-center-window.xml
          grep -q 'At a glance' report/emulator/control-center-window.xml
          grep -q 'Brightness' report/emulator/control-center-window.xml
          grep -q 'Volume' report/emulator/control-center-window.xml
          adb shell dumpsys package com.lucid.os.controlcenter > report/emulator/control-center-package.txt
          grep -q 'ControlCenterTileService' report/emulator/control-center-package.txt
          adb shell am start -W -n com.lucid.os.settings/.MainActivity | tee report/emulator/settings-launch.txt
          sleep 3
          adb shell uiautomator dump /sdcard/lucid-settings.xml >/dev/null
          adb pull /sdcard/lucid-settings.xml report/emulator/settings-window.xml
          grep -q 'PERSONALIZATION' report/emulator/settings-window.xml
          grep -q 'Control Center' report/emulator/settings-window.xml
          adb shell dumpsys activity activities > report/emulator/lucid-app-activities.txt
          grep -Eq 'com\.lucid\.os\.settings' report/emulator/lucid-app-activities.txt
          adb logcat -d -t 5000 > report/emulator/lucid-ui-logcat.txt
          if grep -E 'FATAL EXCEPTION|Process: com\.lucid\.os\.(controlcenter|settings)' report/emulator/lucid-ui-logcat.txt; then
            echo "A Lucid UI app crashed in emulator." >&2
            exit 1
          fi
          echo "PASS: Control Center and Settings installed, launched, exposed expected accessibility labels, and registered the QS tile service." | tee report/emulator/lucid-ui-result.txt

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-wallpaper-emulator-evidence
          path: report/emulator/
          if-no-files-found: warn
          retention-days: 7
