name: Build Cosmos Fluid
on:
  workflow_dispatch:
  push:
    branches:
      - feat/cosmos-liquid-performance
    paths:
      - "cosmos-rebuild/**"
      - ".github/workflows/build-cosmos-fluid.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Validate Android project
        working-directory: cosmos-rebuild
        run: gradle --no-daemon --stacktrace --warning-mode all :app:tasks
      - name: Build debug APK
        working-directory: cosmos-rebuild
        run: gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug
      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cosmos-build-diagnostics
          path: |
            cosmos-rebuild/**/build/reports/**
            cosmos-rebuild/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: cosmos-fluid-debug
          path: cosmos-rebuild/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
