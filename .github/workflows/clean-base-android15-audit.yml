name: Clean Android 15 Base Audit

on:
  push:
    branches: [fix/chroot-desktop-runtime]
    paths:
      - ".github/workflows/clean-base-android15-audit.yml"
      - "docs/CLEAN_BASE_MIGRATION.md"
      - "tools/stage_lucid_overlays.py"
      - "tools/validate_lucid_preservation.py"
      - "tests/test_validate_lucid_preservation.py"
  workflow_dispatch:
    inputs:
      base_rom_url:
        description: Direct HTTPS download URL for the March 2025 Rising-Revived vanilla Android 15 dynamic lavender candidate; verify vanilla/dynamic metadata in the report
        required: true
        default: https://sourceforge.net/projects/termux-lavender/files/Rising-Revived/15.0/RisingOS_Revived-6.3-250319-0738-VANILLA-COMMUNITY-lavender.zip/download
        type: string
      expected_filename:
        description: Expected ROM ZIP filename (letters, digits, dots, underscores, hyphens only)
        required: true
        default: RisingOS_Revived-6.3-250319-0738-VANILLA-COMMUNITY-lavender.zip
        type: string

permissions:
  contents: read

jobs:
  audit-clean-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Test preservation manifest logic
        run: python3 tests/test_validate_lucid_preservation.py -v

      - name: Snapshot mandatory LucidOS preservation payload
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_lucid_preservation.py --root "$GITHUB_WORKSPACE" --output clean-base/audit/lucid-preservation-manifest.json

      - name: Download selected base without modifying existing ROM assets
        env:
          BASE_ROM_URL: ${{ inputs.base_rom_url }}
          EXPECTED_FILENAME: ${{ inputs.expected_filename }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_FILENAME" =~ ^[A-Za-z0-9._-]+\.zip$ ]] || { echo 'Invalid ZIP filename.' >&2; exit 2; }
          case "$BASE_ROM_URL" in https://*) ;; *) echo 'Only HTTPS URLs are accepted.' >&2; exit 2 ;; esac
          mkdir -p clean-base/audit "$RUNNER_TEMP/lucid"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 --max-time 4800 \
            "$BASE_ROM_URL" --output "clean-base/$EXPECTED_FILENAME" \
            --write-out 'http_code=%{http_code}\neffective_url=%{url_effective}\ncontent_type=%{content_type}\nsize_download=%{size_download}\n' \
            | tee clean-base/audit/base-download-response.txt
          test -s "clean-base/$EXPECTED_FILENAME"
          sha256sum "clean-base/$EXPECTED_FILENAME" | tee clean-base/audit/base-sha256.txt
          stat -c 'filename=%n bytes=%s' "clean-base/$EXPECTED_FILENAME" | tee clean-base/audit/base-file.txt
          unzip -tq "clean-base/$EXPECTED_FILENAME"
          unzip -Z1 "clean-base/$EXPECTED_FILENAME" > clean-base/audit/base-zip-entry-list.txt

          # Fetch the existing Lucid archive by immutable release/asset ID. It is only read for comparison.
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/652845990" \
            --output "$RUNNER_TEMP/lucid/LucidOS-unsigned.zip"
          echo '6e9fa4bc2c7dffee9671a02f45bf3b4b7f881b33546cde33b2ea2c9f8ca953b1  '"$RUNNER_TEMP/lucid/LucidOS-unsigned.zip" | sha256sum --check -
          unzip -tq "$RUNNER_TEMP/lucid/LucidOS-unsigned.zip"
          unzip -Z1 "$RUNNER_TEMP/lucid/LucidOS-unsigned.zip" > clean-base/audit/lucid-zip-entry-list.txt

          python3 - "$EXPECTED_FILENAME" <<'PY'
          import json, pathlib, sys, zipfile
          base = pathlib.Path('clean-base') / sys.argv[1]
          import os
          lucid = pathlib.Path(os.environ['RUNNER_TEMP']) / 'lucid' / 'LucidOS-unsigned.zip'
          report = pathlib.Path('clean-base/audit')
          with zipfile.ZipFile(base) as bz, zipfile.ZipFile(lucid) as lz:
              bn, ln = set(bz.namelist()), set(lz.namelist())
              def exact_or_suffix(names, suffix):
                  return sorted(n for n in names if n == suffix or n.endswith('/' + suffix))
              def read_first(z, names, suffix):
                  hits = exact_or_suffix(names, suffix)
                  return z.read(hits[0]).decode('utf-8', 'replace') if hits else ''
              base_metadata = read_first(bz, bn, 'META-INF/com/android/metadata')
              base_updater = read_first(bz, bn, 'META-INF/com/google/android/updater-script')
              base_dyn = read_first(bz, bn, 'dynamic_partitions_op_list')
              base_signals = (base_metadata + '\n' + base_updater + '\n' + base_dyn).lower()
              summary = {
                  'base_archive_entries': len(bn), 'lucid_archive_entries': len(ln),
                  'base_has_boot_img': bool(exact_or_suffix(bn, 'boot.img')),
                  'base_has_dtbo_img': bool(exact_or_suffix(bn, 'dtbo.img')),
                  'base_has_vbmeta_img': bool(exact_or_suffix(bn, 'vbmeta.img')),
                  'base_has_transfer_lists': any(n.endswith('.transfer.list') for n in bn),
                  'base_has_payload_bin': 'payload.bin' in bn,
                  'base_has_dynamic_partition_op_list': bool(exact_or_suffix(bn, 'dynamic_partitions_op_list')),
                  'base_has_system_dat_br': bool(exact_or_suffix(bn, 'system.new.dat.br')),
                  'base_has_vendor_dat_br': bool(exact_or_suffix(bn, 'vendor.new.dat.br')),
                  'base_has_product_dat_br': bool(exact_or_suffix(bn, 'product.new.dat.br')),
                  'metadata_mentions_sdk_35': 'post-sdk-level=35' in base_metadata.lower() or 'pre-sdk-level=35' in base_metadata.lower(),
                  'metadata_mentions_android_15': ('post-sdk-level=35' in base_metadata.lower() or 'pre-sdk-level=35' in base_metadata.lower() or 'android-15' in base_metadata.lower()),
                  'metadata': base_metadata,
                  'updater_mentions_lavender': 'lavender' in base_updater.lower(),
                  'updater_mentions_dynamic_partition_layout': any(x in base_signals for x in ('super_dummy.img', 'dynamic_partitions_op_list', 'retrofit_dynamic_partitions')),
                  'vanilla_status': 'not provable from archive entry names; inspect metadata and package contents before selecting this base',
                  'base_has_lucid_custom_files': any('lucid' in n.lower() for n in bn),
                  'lucid_has_init_scripts_in_zip': any('lucid' in n.lower() and ('init' in n.lower() or n.endswith('.sh')) for n in ln),
                  'lucid_zip_entries_not_in_base_zip': sorted(ln - bn),
                  'base_zip_entries_not_in_lucid_zip': sorted(bn - ln),
              }
              (report / 'zip-entry-comparison.json').write_text(json.dumps(summary, indent=2) + '\n')
              for label, z, names in [('base', bz, bn), ('lucid', lz, ln)]:
                  wanted = [n for n in names if n.endswith((
                      'META-INF/com/android/metadata', 'META-INF/com/google/android/updater-script',
                      'dynamic_partitions_op_list', 'payload_properties.txt', 'boot.img', 'dtbo.img',
                      'vbmeta.img', 'super_dummy.img', 'system.transfer.list', 'vendor.transfer.list',
                      'product.transfer.list', 'system_ext.transfer.list', 'odm.transfer.list',
                      'system.new.dat.br', 'vendor.new.dat.br', 'product.new.dat.br',
                      'system_ext.new.dat.br', 'odm.new.dat.br', 'payload.bin'))]
                  lines = [f'archive_entries={len(names)}']
                  for n in sorted(wanted):
                      lines.append(f'{n}\t{z.getinfo(n).file_size}')
                      if n.endswith(('META-INF/com/android/metadata', 'META-INF/com/google/android/updater-script', 'dynamic_partitions_op_list')):
                          out = report / f'{label}-{n.replace("/", "_")}.txt'
                          out.write_text(z.read(n).decode('utf-8', 'replace'))
                  (report / f'{label}-structure.txt').write_text('\n'.join(lines) + '\n')
          print((report / 'zip-entry-comparison.json').read_text())
          PY

      - name: Reconstruct and validate the selected base product filesystem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clean-base/audit/product-check "$RUNNER_TEMP/base-product"
          BASE_ZIP="clean-base/${{ inputs.expected_filename }}"
          if ! unzip -Z1 "$BASE_ZIP" | grep -qx 'product.transfer.list' ||
             ! unzip -Z1 "$BASE_ZIP" | grep -qx 'product.new.dat.br'; then
            echo "Selected archive does not expose product.transfer.list + product.new.dat.br; image-format-specific inspection is required." | tee clean-base/audit/product-check/RESULT.txt
            exit 0
          fi
          unzip -p "$BASE_ZIP" product.transfer.list > "$RUNNER_TEMP/base-product/product.transfer.list"
          unzip -p "$BASE_ZIP" product.new.dat.br > "$RUNNER_TEMP/base-product/product.new.dat.br"
          python3 -m venv "$RUNNER_TEMP/product-venv"
          "$RUNNER_TEMP/product-venv/bin/pip" install --quiet brotli
          "$RUNNER_TEMP/product-venv/bin/python" tools/reconstruct_transfer_image.py \
            "$RUNNER_TEMP/base-product/product.transfer.list" \
            "$RUNNER_TEMP/base-product/product.new.dat.br" \
            "$RUNNER_TEMP/base-product/product.img" \
            > clean-base/audit/product-check/reconstruction.txt 2>&1 || {
              cat clean-base/audit/product-check/reconstruction.txt
              echo "Product reconstruction failed; candidate is not accepted." | tee clean-base/audit/product-check/RESULT.txt
              exit 0
            }
          file "$RUNNER_TEMP/base-product/product.img" | tee clean-base/audit/product-check/file.txt
          sha256sum "$RUNNER_TEMP/base-product/product.img" | tee clean-base/audit/product-check/sha256.txt
          set +e
          e2fsck -fn "$RUNNER_TEMP/base-product/product.img" > clean-base/audit/product-check/e2fsck.txt 2>&1
          fsck_rc=$?
          set -e
          printf 'e2fsck_exit_code=%s\n' "$fsck_rc" | tee clean-base/audit/product-check/RESULT.txt
          if [ "$fsck_rc" -eq 0 ]; then
            echo "Product image passed read-only e2fsck; this is one acceptance gate, not proof of device bootability." | tee -a clean-base/audit/product-check/RESULT.txt
          else
            echo "Product image did not pass read-only e2fsck; do not package this base without a verified full product image/tree." | tee -a clean-base/audit/product-check/RESULT.txt
          fi

      - name: Publish intake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucid-clean-base-intake
          path: clean-base/audit/
          if-no-files-found: warn
          retention-days: 30
