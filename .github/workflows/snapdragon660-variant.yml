name: Snapdragon 660 Variant
on:
  push:
    paths:
      - 'emulator/snapdragon660/**'
      - 'emulator/tests/**'
      - '.github/workflows/snapdragon660-variant.yml'
  pull_request:
    paths:
      - 'emulator/snapdragon660/**'
      - 'emulator/tests/**'
      - '.github/workflows/snapdragon660-variant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdm660-profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Snapdragon board profile and generated device tree
        run: |
          python -m unittest discover -s emulator/snapdragon660/tests -v
          python emulator/snapdragon660/tools/build_platform_description.py --check
          python emulator/snapdragon660/tools/run_board_contract.py --output emulator/snapdragon660/board-contract-smoke.json
      - name: Inventory public SDM660 hardware description
        run: |
          mkdir -p emulator/snapdragon660/upstream
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/xiaomi-sdm660/android_kernel_xiaomi_sdm660/5ce3bc43631dca83f6081757c8982c2d5f6e017c/arch/arm/boot/dts/qcom/sdm660.dtsi \
            --output emulator/snapdragon660/upstream/sdm660.dtsi
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/okta-10/mystic_kernel_sdm660-4.4/3fbc81d0cd7ee4116a72926b3777ea0379be9dd7/arch/arm/boot/dts/qcom/sdm660-mtp_lavender.dtsi \
            --output emulator/snapdragon660/upstream/sdm660-mtp_lavender.dtsi
          python emulator/snapdragon660/tools/inventory_dts_hardware.py \
            --input xiaomi-sdm660/android_kernel_xiaomi_sdm660@5ce3bc43631dca83f6081757c8982c2d5f6e017c=emulator/snapdragon660/upstream/sdm660.dtsi \
            --input okta-10/mystic_kernel_sdm660-4.4@3fbc81d0cd7ee4116a72926b3777ea0379be9dd7=emulator/snapdragon660/upstream/sdm660-mtp_lavender.dtsi \
            --output emulator/snapdragon660/sdm660-hardware-inventory.json
          python -c "import json; p=json.load(open('emulator/snapdragon660/sdm660-hardware-inventory.json')); assert p['counts']['nodes_with_reg'] > 10; assert p['boot_critical_candidates']['interrupt_controller']; assert p['boot_critical_candidates']['uart']; u=[n for n in p['boot_critical_candidates']['uart'] if n['label']=='uartblsp1dm1']; assert u and u[0]['status']==['ok'], u; print(json.dumps({'counts':p['counts'],'lavender_console_status':u[0]['status']}, indent=2))"
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm device-tree-compiler
      - name: Verify QEMU's available CPU models and machine capabilities
        run: |
          qemu-system-aarch64 -machine help > machine-help.txt
          qemu-system-aarch64 -cpu help > cpu-help.txt
          python emulator/snapdragon660/tools/check_host_qemu.py --machines machine-help.txt --cpus cpu-help.txt --output qemu-capabilities.json
      - name: Upload Snapdragon variant artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snapdragon660-lavender-variant
          path: |
            emulator/snapdragon660/platform-description.json
            emulator/snapdragon660/device-tree/sdm660-lavender.dts
            qemu-capabilities.json
            emulator/snapdragon660/board-contract-smoke.json
            emulator/snapdragon660/sdm660-hardware-inventory.json
            emulator/snapdragon660/upstream/sdm660.dtsi
            emulator/snapdragon660/upstream/sdm660-mtp_lavender.dtsi
