name: LucidOS Boot Image Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/inspect_boot_image.py
      - .github/workflows/rom-boot-image-audit.yml

permissions:
  contents: write

jobs:
  inspect-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download unsigned OTA archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rom" "$RUNNER_TEMP/boot" report
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          ASSET_ID="$(python3 - "$RUNNER_TEMP/releases.json" <<'PY'
          import json, sys
          for r in json.load(open(sys.argv[1])):
              if r.get("tag_name") == "tobelucid-source-v1":
                  for a in r.get("assets", []):
                      if a.get("name") == "LucidOS-unsigned.zip":
                          print(a["id"]); raise SystemExit(0)
          raise SystemExit("LucidOS-unsigned.zip not found in the draft release")
          PY
          )"
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
            --output "$RUNNER_TEMP/rom/LucidOS-unsigned.zip"
          python3 - "$RUNNER_TEMP/rom/LucidOS-unsigned.zip" "$RUNNER_TEMP/boot" <<'PY'
          import os, sys, zipfile
          archive, outdir = sys.argv[1:]
          with zipfile.ZipFile(archive) as z:
              for name in ("boot.img", "dtbo.img", "vbmeta.img"):
                  with z.open(name) as src, open(os.path.join(outdir,name),"wb") as dst:
                      while True:
                          chunk=src.read(4*1024*1024)
                          if not chunk: break
                          dst.write(chunk)
          PY
          sha256sum "$RUNNER_TEMP/boot/"* > report/boot-image-sha256.txt
          file "$RUNNER_TEMP/boot/"* > report/boot-image-file-types.txt
          python3 tools/inspect_boot_image.py "$RUNNER_TEMP/boot/boot.img" report
          python3 - "$RUNNER_TEMP/boot/vbmeta.img" "$RUNNER_TEMP/boot/dtbo.img" >> report/boot-header-report.txt <<'PY'
          import hashlib, os, struct, sys
          for path in sys.argv[1:]:
              data=open(path,'rb').read()
              print("\n===== "+os.path.basename(path)+" =====")
              print("bytes:",len(data),"sha256:",hashlib.sha256(data).hexdigest())
              print("first_64_bytes:",data[:64].hex())
              if os.path.basename(path)=="vbmeta.img" and data[:4]==b"AVB0" and len(data)>=124:
                  print("avb0_magic: True")
                  print("required_libavb:",struct.unpack_from(">II",data,4))
                  print("auth_block_size:",struct.unpack_from(">Q",data,12)[0])
                  print("aux_block_size:",struct.unpack_from(">Q",data,20)[0])
                  print("algorithm_type:",struct.unpack_from(">I",data,28)[0])
                  print("rollback_index:",struct.unpack_from(">Q",data,112)[0])
                  flags=struct.unpack_from(">I",data,120)[0]
                  print("flags:",flags,"hashtree_disabled:",bool(flags&1),"verification_disabled:",bool(flags&2))
                  print("rollback_index_location:",struct.unpack_from(">I",data,124)[0])
              elif os.path.basename(path)=="dtbo.img":
                  print("dtbo_magic_expected_d7b7ab1e:",data[:4]==bytes.fromhex("d7b7ab1e"))
          PY
          file report/kernel.bin report/ramdisk.raw report/ramdisk.cpio 2>/dev/null > report/ramdisk-file-types.txt || true

      - name: Upload boot and ramdisk audit
        uses: actions/upload-artifact@v4
        with:
          name: lucid-boot-image-audit
          path: report/
          if-no-files-found: error
          retention-days: 7
