name: Inspect Actual Lucid OTA System Partitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-system:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download and verify exact OTA from manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit parts extracted mount
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ota/stable.json?ref=main" \
            -o "$RUNNER_TEMP/manifest-response.json"
          python3 - "$RUNNER_TEMP/manifest-response.json" "$RUNNER_TEMP/manifest.json" <<'PY'
          import base64,json,sys
          o=json.load(open(sys.argv[1]))
          open(sys.argv[2],"wb").write(base64.b64decode(o["content"]))
          PY
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["device"]=="lavender"
          assert m["url"].endswith("LucidOS-Android15-lavender-build-4-experimental.zip")
          print(json.dumps({k:m[k] for k in ("device","version","url","size","sha256")},indent=2))
          PY
          URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "$RUNNER_TEMP/manifest.json")"
          SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/manifest.json")"
          SIZE="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["size"])' "$RUNNER_TEMP/manifest.json")"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$URL" -o "$RUNNER_TEMP/lucid-ota.zip"
          test "$(stat -c %s "$RUNNER_TEMP/lucid-ota.zip")" = "$SIZE"
          echo "$SHA  $RUNNER_TEMP/lucid-ota.zip" | sha256sum -c -
          echo "Verified exact manifest asset: $SIZE bytes / $SHA" | tee audit/asset-verification.txt

      - name: Inventory partition formats and extract system payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/lucid-ota.zip" parts audit <<'PY'
          import os,re,sys,zipfile
          zp,out,audit=sys.argv[1:]
          os.makedirs(out,exist_ok=True)
          with zipfile.ZipFile(zp) as z:
              names=set(z.namelist())
              with open(os.path.join(audit,"partition-format-inventory.txt"),"w") as f:
                  for n in sorted(names):
                      if (re.search(r'(system|vendor|product|odm|system_ext|system_dlkm|vendor_dlkm|odm_dlkm|super|payload|dynamic_partitions)',n,re.I)
                          or n in ("META-INF/com/android/metadata","META-INF/com/google/android/updater-script")):
                          i=z.getinfo(n);f.write(f"{i.file_size:12d} {n}\n")
              for n in ("META-INF/com/android/metadata","META-INF/com/google/android/updater-script","dynamic_partitions_op_list","META-INF/com/google/android/update-binary"):
                  if n in names and not n.endswith("update-binary"):
                      dest=os.path.join(audit,n.replace("/","_"))
                      open(dest,"wb").write(z.read(n))
              parts=[]
              for n in names:
                  m=re.fullmatch(r'([A-Za-z0-9_]+)\.new\.dat(\.br)?',n)
                  if m and m.group(1)+".transfer.list" in names:
                      parts.append((m.group(1),n,m.group(1)+".transfer.list"))
              if not parts:
                  raise SystemExit("No block-based partition payloads found; see partition-format-inventory.txt")
              for part,data_name,transfer_name in sorted(parts):
                  for name in (data_name,transfer_name):
                      dst=os.path.join(out,name)
                      with z.open(name) as src,open(dst,"wb") as dstf:
                          while True:
                              b=src.read(4*1024*1024)
                              if not b:break
                              dstf.write(b)
                  print(f"extracted {part}: {data_name}, {transfer_name}")
          PY
          cat audit/META-INF_com_android_metadata > audit/android-ota-metadata.txt 2>/dev/null || true
          if [ -f audit/META-INF_com_google_android_updater-script ]; then
            grep -nEi 'block_image_update|mount|system|system_ext|product|vendor|odm|dynamic|super|by-name' audit/META-INF_com_google_android_updater-script > audit/installer-partition-mapping.txt || true
          fi

      - name: Reconstruct block-based logical partition images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y brotli e2fsprogs
          python3 - "$RUNNER_TEMP/parts" <<'PY'
          import glob,os,sys
          root=sys.argv[1]; block=4096
          for transfer in sorted(glob.glob(os.path.join(root,"*.transfer.list"))):
              part=os.path.basename(transfer).removesuffix(".transfer.list")
              br=os.path.join(root,part+".new.dat.br")
              raw=os.path.join(root,part+".new.dat")
              if os.path.exists(br):
                  import subprocess
                  subprocess.run(["brotli","--decompress","--force",f"--output={raw}",br],check=True)
              if not os.path.exists(raw):
                  print(f"SKIP {part}: no new.dat stream");continue
              lines=open(transfer).read().splitlines()
              version=int(lines[0]); total=int(lines[1])
              outpath=os.path.join(root,part+".img")
              with open(outpath,"wb") as out: out.truncate(total*block)
              consumed=0; operations={}
              with open(raw,"rb") as src,open(outpath,"r+b") as out:
                  for line in lines[4:]:
                      if not line.strip():continue
                      op,rest=line.split(" ",1)
                      operations[op]=operations.get(op,0)+1
                      if op in ("zero","erase"):continue
                      if op!="new":
                          raise SystemExit(f"{part}: unsupported transfer-list op {op}; refusing to produce an incomplete image")
                      nums=[int(x) for x in rest.split(",")]
                      count=nums[0]
                      if count%2 or count+1!=len(nums):raise SystemExit(f"{part}: malformed range {line}")
                      for j in range(1,len(nums),2):
                          start,end=nums[j:j+2]
                          if start<0 or end<start or end>total:raise SystemExit(f"{part}: out-of-range blocks {start}:{end}/{total}")
                          out.seek(start*block)
                          remain=(end-start)*block
                          while remain:
                              chunk=src.read(min(4*1024*1024,remain))
                              if not chunk:raise SystemExit(f"{part}: truncated new.dat stream")
                              out.write(chunk);remain-=len(chunk);consumed+=len(chunk)
              actual=os.path.getsize(raw)
              if consumed!=actual:raise SystemExit(f"{part}: consumed {consumed} of {actual} stream bytes")
              print(f"{part}: transfer-list-v{version}, blocks={total}, image_bytes={total*block}, stream_bytes={consumed}, operations={operations}")
              with open(os.path.join(root,part+".reconstruction.txt"),"w") as f:
                  f.write(f"partition={part}\nversion={version}\nblocks={total}\nimage_bytes={total*block}\nstream_bytes={consumed}\noperations={operations}\n")
          PY
          for f in parts/*.img; do
            [ -e "$f" ] || continue
            file "$f"
            e2fsck -fn "$f" > "audit/$(basename "$f")-e2fsck.txt" 2>&1 || true
          done
          cat parts/*.reconstruction.txt > audit/reconstruction-summary.txt 2>/dev/null || true

      - name: Mount system-family partitions read-only and inventory Android framework
        shell: bash
        run: |
          set -euo pipefail
          for part in system system_ext product system_dlkm; do
            img="parts/$part.img"
            [ -f "$img" ] || continue
            mkdir -p "mount/$part"
            sudo mount -o loop,ro,noload "$img" "mount/$part"
          done
          {
            echo "=== SYSTEM ROOT / TOP LEVEL ==="
            sudo find mount/system -maxdepth 3 -mindepth 1 -printf '%y %p %s\n' 2>/dev/null | sort | head -n 20000 || true
            echo
            echo "=== SYSTEM FRAMEWORK / INIT / VINTF / FSTAB FILES ==="
            sudo find mount/system mount/system_ext mount/product -type f \( -name '*.rc' -o -name '*.xml' -o -name '*.prop' -o -name '*.json' -o -name '*.conf' -o -name 'fstab*' -o -name '*.mk' -o -name '*.te' \) -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 30000 || true
            echo
            echo "=== KERNEL MODULES / DTB / FIRMWARE IN SYSTEM FAMILY ==="
            sudo find mount/system mount/system_ext mount/product mount/system_dlkm -type f \( -name '*.ko' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'modules.*' \) -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 20000 || true
          } > audit/system-family-inventory.txt
          sudo grep -RaiE -m 4 'lavender|sdm660|qcom,sdm660|NVTCapacitiveTouchScreen|novatek|nt36|nt36672|td4320|kgsl|adreno|mdss|panel|touchscreen|/dev/block/.*(system|super)|dynamic_partitions|ro\.build\.version\.release|ro\.product\.device|ro\.product\.vendor' mount/system/etc mount/system_ext/etc mount/product/etc 2>/dev/null | head -n 12000 > audit/system-hardware-config-matches.txt || true
          {
            for root in mount/system mount/system_ext mount/product; do
              [ -d "$root" ] || continue
              for sub in etc/vintf etc/init etc/permissions etc/sysconfig etc/security etc/selinux; do
                [ -d "$root/$sub" ] || continue
                sudo find "$root/$sub" -type f -maxdepth 5 -print
              done
            done
          } | sort > audit/framework-critical-file-paths.txt
          {
            for part in system system_ext product system_dlkm; do
              [ -d "mount/$part" ] && sudo umount "mount/$part"
            done
          }

      - name: Summarize and upload system inspection
        if: always()
        run: |
          {
            echo "# Actual Lucid OTA system-family inspection"
            for f in audit/*; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f")"
              echo '~~~'
              head -n 700 "$f"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: actual-lucid-system-partition-inspection
          path: |
            audit/
            parts/*.reconstruction.txt
          if-no-files-found: error
          retention-days: 14
