name: Inspect Actual Lucid OTA System Partitions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-system:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Download and verify exact OTA from manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit parts extracted mount
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/ota/stable.json?ref=main" \
            -o "$RUNNER_TEMP/manifest-response.json"
          python3 - "$RUNNER_TEMP/manifest-response.json" "$RUNNER_TEMP/manifest.json" <<'PY'
          import base64,json,sys
          o=json.load(open(sys.argv[1]))
          open(sys.argv[2],"wb").write(base64.b64decode(o["content"]))
          PY
          python3 - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1]))
          assert m["device"]=="lavender"
          assert m["url"].endswith("LucidOS-Android15-lavender-build-4-experimental.zip")
          print(json.dumps({k:m[k] for k in ("device","version","url","size","sha256")},indent=2))
          PY
          URL="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["url"])' "$RUNNER_TEMP/manifest.json")"
          SHA="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/manifest.json")"
          SIZE="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["size"])' "$RUNNER_TEMP/manifest.json")"
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 30 "$URL" -o "$RUNNER_TEMP/lucid-ota.zip"
          test "$(stat -c %s "$RUNNER_TEMP/lucid-ota.zip")" = "$SIZE"
          echo "$SHA  $RUNNER_TEMP/lucid-ota.zip" | sha256sum -c -
          echo "Verified exact manifest asset: $SIZE bytes / $SHA" | tee audit/asset-verification.txt

      - name: Inventory partition formats and extract system payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/lucid-ota.zip" parts audit <<'PY'
          import os,re,sys,zipfile
          zp,out,audit=sys.argv[1:]
          os.makedirs(out,exist_ok=True)
          with zipfile.ZipFile(zp) as z:
              names=set(z.namelist())
              with open(os.path.join(audit,"partition-format-inventory.txt"),"w") as f:
                  for n in sorted(names):
                      if (re.search(r'(system|vendor|product|odm|system_ext|system_dlkm|vendor_dlkm|odm_dlkm|super|payload|dynamic_partitions)',n,re.I)
                          or n in ("META-INF/com/android/metadata","META-INF/com/google/android/updater-script")):
                          i=z.getinfo(n);f.write(f"{i.file_size:12d} {n}\n")
              for n in ("META-INF/com/android/metadata","META-INF/com/google/android/updater-script","dynamic_partitions_op_list","META-INF/com/google/android/update-binary"):
                  if n in names and not n.endswith("update-binary"):
                      dest=os.path.join(audit,n.replace("/","_"))
                      open(dest,"wb").write(z.read(n))
              parts=[]
              for n in names:
                  m=re.fullmatch(r'([A-Za-z0-9_]+)\.new\.dat(\.br)?',n)
                  if m and m.group(1)+".transfer.list" in names:
                      parts.append((m.group(1),n,m.group(1)+".transfer.list"))
              if not parts:
                  raise SystemExit("No block-based partition payloads found; see partition-format-inventory.txt")
              for part,data_name,transfer_name in sorted(parts):
                  for name in (data_name,transfer_name):
                      dst=os.path.join(out,name)
                      with z.open(name) as src,open(dst,"wb") as dstf:
                          while True:
                              b=src.read(4*1024*1024)
                              if not b:break
                              dstf.write(b)
                  print(f"extracted {part}: {data_name}, {transfer_name}")
          PY
          cat audit/META-INF_com_android_metadata > audit/android-ota-metadata.txt 2>/dev/null || true
          if [ -f audit/META-INF_com_google_android_updater-script ]; then
            grep -nEi 'block_image_update|mount|system|system_ext|product|vendor|odm|dynamic|super|by-name' audit/META-INF_com_google_android_updater-script > audit/installer-partition-mapping.txt || true
          fi

      - name: Reconstruct block-based logical partition images
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y brotli e2fsprogs erofs-utils android-sdk-libsparse-utils
          python3 - "parts" <<'PY'
          import os,subprocess,sys
          root=sys.argv[1]; block=4096
          for part in ("system","system_ext","product"):
              transfer=os.path.join(root,part+".transfer.list")
              if not os.path.isfile(transfer):
                  continue
              br=os.path.join(root,part+".new.dat.br")
              raw=os.path.join(root,part+".new.dat")
              if os.path.exists(br):
                  subprocess.run(["brotli","--decompress","--force",f"--output={raw}",br],check=True)
              if not os.path.exists(raw):
                  raise SystemExit(f"{part}: missing new.dat stream")
              lines=open(transfer).read().splitlines()
              version=int(lines[0]); total=int(lines[1])
              outpath=os.path.join(root,part+".img")
              with open(outpath,"wb") as out:
                  out.truncate(total*block)
              consumed=0; operations={}
              with open(raw,"rb") as src,open(outpath,"r+b") as out:
                  for line in lines[4:]:
                      if not line.strip():
                          continue
                      op,rest=line.split(" ",1)
                      operations[op]=operations.get(op,0)+1
                      if op in ("zero","erase"):
                          continue
                      if op!="new":
                          raise SystemExit(f"{part}: unsupported transfer-list op {op}; refusing incomplete image")
                      nums=[int(x) for x in rest.split(",")]
                      count=nums[0]
                      if count%2 or count+1!=len(nums):
                          raise SystemExit(f"{part}: malformed range {line}")
                      for j in range(1,len(nums),2):
                          start,end=nums[j:j+2]
                          if start<0 or end<start or end>total:
                              raise SystemExit(f"{part}: out-of-range blocks {start}:{end}/{total}")
                          out.seek(start*block)
                          remain=(end-start)*block
                          while remain:
                              chunk=src.read(min(4*1024*1024,remain))
                              if not chunk:
                                  raise SystemExit(f"{part}: truncated new.dat stream")
                              out.write(chunk);remain-=len(chunk);consumed+=len(chunk)
              actual=os.path.getsize(raw)
              if consumed!=actual:
                  raise SystemExit(f"{part}: consumed {consumed} of {actual} stream bytes")
              print(f"{part}: transfer-list-v{version}, blocks={total}, image_bytes={total*block}, stream_bytes={consumed}, operations={operations}")
              with open(os.path.join(root,part+".reconstruction.txt"),"w") as f:
                  f.write(f"partition={part}\nversion={version}\nblocks={total}\nimage_bytes={total*block}\nstream_bytes={consumed}\noperations={operations}\n")
          PY
          for f in parts/system.img parts/system_ext.img parts/product.img; do
            [ -e "$f" ] || continue
            file "$f" | tee -a audit/reconstructed-image-types.txt
          done
          cat parts/*.reconstruction.txt > audit/reconstruction-summary.txt 2>/dev/null || true

      - name: Mount system-family partitions read-only and inventory Android framework
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p mount
          : > audit/image-filesystem-types.txt
          : > audit/mount-status.txt
          for part in system system_ext product system_dlkm; do
            img="parts/$part.img"
            [ -f "$img" ] || continue
            echo "=== $part ===" | tee -a audit/image-filesystem-types.txt
            if ! file -s "$img" | tee -a audit/image-filesystem-types.txt; then
              echo "$part: file inspection failed" | tee -a audit/mount-status.txt
              continue
            fi
            mkdir -p "mount/$part"
            if grep -qi "Android sparse image" <(file -b "$img"); then
              if ! simg2img "$img" "parts/$part.raw.img"; then
                echo "$part: sparse image conversion failed" | tee -a audit/mount-status.txt
                continue
              fi
              img="parts/$part.raw.img"
              if ! file -s "$img" | tee -a audit/image-filesystem-types.txt; then
                echo "$part: converted image inspection failed" | tee -a audit/mount-status.txt
                continue
              fi
            fi
            if grep -qi "EROFS" <(file -b "$img"); then
              if sudo mount -t erofs -o loop,ro "$img" "mount/$part" 2>>audit/mount-status.txt; then rc=0; else rc=$?; fi
            else
              if sudo mount -t ext4 -o loop,ro,noload "$img" "mount/$part" 2>>audit/mount-status.txt; then rc=0; else rc=$?; fi
            fi
            if [ "$rc" -eq 0 ]; then
              echo "$part: mounted read-only" | tee -a audit/mount-status.txt
            else
              echo "$part: mount failed (exit $rc); filesystem type is recorded above" | tee -a audit/mount-status.txt
            fi
          done
          mkdir -p audit/configs
          copy_if_present() {
            src="$1"; dst="audit/configs/$2"
            if [ -f "$src" ]; then sudo cp --parents "$src" "audit/configs"; fi
          }
          copy_if_present mount/system/system/build.prop system-build.prop
          copy_if_present mount/system/system/etc/init.lucid.rc init.lucid.rc
          copy_if_present mount/system/system/etc/init/hw/init.rc init.rc
          copy_if_present mount/system/system/etc/vintf/manifest.xml system-vintf-manifest.xml
          copy_if_present mount/system/system/etc/fstab.postinstall fstab.postinstall
          copy_if_present mount/system_ext/etc/build.prop system-ext-build.prop
          copy_if_present mount/system_ext/etc/vintf/manifest.xml system-ext-vintf-manifest.xml
          copy_if_present mount/product/etc/build.prop product-build.prop
          copy_if_present mount/product/etc/build-manifest.xml product-build-manifest.xml
          copy_if_present mount/product/etc/permissions/privapp-permissions-lucid.xml lucid-privapp-permissions.xml
          copy_if_present mount/system/system/system_dlkm/etc/build.prop system-dlkm-build.prop
          for d in mount/system/system/etc/lucid mount/system/system/usr/lucid; do
            if [ -d "$d" ]; then sudo cp -a "$d" audit/configs/; fi
          done
          sudo chmod -R a+rX audit/configs
          sudo find mount/system mount/system_ext mount/product -type f \( -name '*.ko' -o -name 'modules.*' -o -name '*.dtb' -o -name '*.dtbo' \) -printf '%p %s bytes\n' 2>/dev/null | sort > audit/system-family-kernel-assets.txt || true
          {
            echo "=== SYSTEM ROOT / TOP LEVEL ==="
            for root in mount/system mount/system_ext mount/product mount/system_dlkm; do
              [ -d "$root" ] || continue
              sudo find "$root" -maxdepth 3 -mindepth 1 -printf '%y %p %s\n' 2>/dev/null | sort | head -n 20000 || true
            done
            echo
            echo "=== SYSTEM FRAMEWORK / INIT / VINTF / FSTAB FILES ==="
            for root in mount/system mount/system_ext mount/product; do
              [ -d "$root" ] || continue
              sudo find "$root" -type f \( -name '*.rc' -o -name '*.xml' -o -name '*.prop' -o -name '*.json' -o -name '*.conf' -o -name 'fstab*' -o -name '*.mk' -o -name '*.te' \) -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 30000 || true
            done
            echo
            echo "=== KERNEL MODULES / DTB / FIRMWARE IN SYSTEM FAMILY ==="
            for root in mount/system mount/system_ext mount/product mount/system_dlkm; do
              [ -d "$root" ] || continue
              sudo find "$root" -type f \( -name '*.ko' -o -name '*.dtb' -o -name '*.dtbo' -o -name 'modules.*' \) -printf '%p %s bytes\n' 2>/dev/null | sort | head -n 20000 || true
            done
          } > audit/system-family-inventory.txt
          for root in mount/system/etc mount/system_ext/etc mount/product/etc; do
            [ -d "$root" ] || continue
            sudo grep -RaiE -m 4 'lavender|sdm660|qcom,sdm660|NVTCapacitiveTouchScreen|novatek|nt36|nt36672|td4320|kgsl|adreno|mdss|panel|touchscreen|/dev/block/.*(system|super)|dynamic_partitions|ro\.build\\.version\\.release|ro\.product\\.device|ro\.product\\.vendor' "$root" 2>/dev/null | head -n 12000 >> audit/system-hardware-config-matches.txt || true
          done
          {
            for root in mount/system mount/system_ext mount/product; do
              [ -d "$root" ] || continue
              for sub in etc/vintf etc/init etc/permissions etc/sysconfig etc/security etc/selinux; do
                [ -d "$root/$sub" ] || continue
                sudo find "$root/$sub" -type f -maxdepth 5 -print
              done
            done
          } | sort > audit/framework-critical-file-paths.txt
          for part in system system_ext product system_dlkm; do
            mountpoint -q "mount/$part" && sudo umount "mount/$part" || true
          done

      - name: Summarize and upload system inspection
        if: always()
        run: |
          {
            echo "# Actual Lucid OTA system-family inspection"
            for f in audit/*; do
              [ -f "$f" ] || continue
              echo
              echo "## $(basename "$f")"
              echo '~~~'
              head -n 700 "$f"
              echo '~~~'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-lucid-system-partition-inspection
          path: |
            audit/
            parts/*.reconstruction.txt
          if-no-files-found: error
          retention-days: 14
